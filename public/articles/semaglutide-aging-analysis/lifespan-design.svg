<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" font-family="-apple-system, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <rect width="920" height="540" fill="#f8fafc"/>
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#0f172a">晚年 Semaglutide 壽命試驗：設計與中位壽命結果</text>
  <text x="30" y="58" font-size="13" fill="#64748b">Feng Y. 等，《Nature》2026;657:469–476，Fig. 1a Kaplan–Meier 曲線自繪示意（非原圖轉載）</text>

  <!-- KM plot area -->
  <rect x="30" y="75" width="560" height="330" fill="#ffffff" stroke="#e2e8f0" rx="8"/>
  <text x="50" y="100" font-size="13" font-weight="bold" fill="#0f172a">存活率（20 月齡雌性 C57BL/6，每日皮下注射至死亡）</text>

  <!-- axes -->
  <line x1="90" y1="120" x2="90" y2="370" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="90" y1="370" x2="560" y2="370" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40" y="125" font-size="11" fill="#64748b">100%</text>
  <text x="48" y="250" font-size="11" fill="#64748b">50%</text>
  <text x="48" y="368" font-size="11" fill="#64748b">0%</text>
  <text x="520" y="392" font-size="11" fill="#64748b">天數</text>
  <text x="200" y="392" font-size="11" fill="#64748b">600</text>
  <text x="330" y="392" font-size="11" fill="#64748b">800</text>
  <text x="470" y="392" font-size="11" fill="#64748b">1000</text>

  <!-- gridlines at 50% -->
  <line x1="90" y1="245" x2="560" y2="245" stroke="#e2e8f0" stroke-dasharray="4 4"/>

  <!-- control curve: starts (600d,100%) stepwise down, median 742 -->
  <polyline points="90,120 150,120 150,160 210,160 210,205 260,205 260,245 300,245 300,280 340,280 340,310 390,310 390,340 440,340 440,362 500,362" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- sema curve: shifted right, median 834 -->
  <polyline points="90,120 170,120 170,150 230,150 230,185 290,185 290,220 350,220 350,245 400,245 400,275 450,275 450,305 500,305 500,335 540,335" fill="none" stroke="#16a34a" stroke-width="2.5"/>

  <!-- median dashed lines -->
  <line x1="268" y1="245" x2="268" y2="370" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="1.5"/>
  <line x1="372" y1="245" x2="372" y2="370" stroke="#16a34a" stroke-dasharray="5 4" stroke-width="1.5"/>
  <circle cx="268" cy="245" r="5" fill="#94a3b8"/>
  <circle cx="372" cy="245" r="5" fill="#16a34a"/>
  <text x="196" y="365" font-size="12" font-weight="bold" fill="#475569">對照 742 天</text>
  <text x="382" y="340" font-size="12" font-weight="bold" fill="#16a34a">用藥 834 天</text>

  <!-- legend -->
  <rect x="400" y="126" width="14" height="14" fill="#16a34a" rx="3"/>
  <text x="420" y="138" font-size="12" fill="#0f172a">Semaglutide</text>
  <rect x="400" y="148" width="14" height="14" fill="#94a3b8" rx="3"/>
  <text x="420" y="160" font-size="12" fill="#0f172a">生理食鹽水對照</text>

  <!-- result card -->
  <rect x="610" y="75" width="280" height="330" fill="#f0fdf4" stroke="#86efac" rx="8"/>
  <text x="630" y="108" font-size="15" font-weight="bold" fill="#14532d">中位壽命</text>
  <text x="630" y="150" font-size="13" fill="#475569">對照組</text>
  <text x="630" y="182" font-size="30" font-weight="bold" fill="#475569">742 天</text>
  <text x="630" y="222" font-size="13" fill="#475569">Semaglutide 組</text>
  <text x="630" y="254" font-size="30" font-weight="bold" fill="#16a34a">834 天</text>
  <text x="630" y="292" font-size="15" font-weight="bold" fill="#14532d">＋92 天（＋12.4%）</text>
  <text x="630" y="316" font-size="12" fill="#475569">驗算：92 ÷ 742 ＝ 12.4%</text>
  <text x="630" y="338" font-size="12" fill="#475569">進食量 −24%，體重降</text>
  <text x="630" y="360" font-size="12" fill="#475569">主因脂肪減少；</text>
  <text x="630" y="382" font-size="12" fill="#475569">終點類別分佈組間無差異</text>

  <!-- design strip -->
  <rect x="30" y="420" width="860" height="95" fill="#ffffff" stroke="#e2e8f0" rx="8"/>
  <text x="50" y="447" font-size="14" font-weight="bold" fill="#0f172a">三臂對照設計（20 月齡 ≈ 人類 60 歲，母鼠；避免雄鼠打鬥干擾）</text>
  <rect x="50" y="458" width="240" height="44" fill="#f1f5f9" stroke="#cbd5e1" rx="6"/>
  <text x="62" y="477" font-size="12" font-weight="bold" fill="#475569">A. 對照：生理食鹽水</text>
  <text x="62" y="494" font-size="11" fill="#64748b">壽命隊列：給藥至死亡</text>
  <rect x="310" y="458" width="260" height="44" fill="#f0fdf4" stroke="#86efac" rx="6"/>
  <text x="322" y="477" font-size="12" font-weight="bold" fill="#16a34a">B. Semaglutide：每日皮下注射</text>
  <text x="322" y="494" font-size="11" fill="#64748b">另設 3 個月隊列做功能＋分子檢測</text>
  <rect x="590" y="458" width="280" height="44" fill="#fffbeb" stroke="#fcd34d" rx="6"/>
  <text x="602" y="477" font-size="12" font-weight="bold" fill="#92400e">C. 24% 熱量限制（n＝10/組）</text>
  <text x="602" y="494" font-size="11" fill="#64748b">縱向 5 個月，基線／2／4 個月量測</text>
</svg>
