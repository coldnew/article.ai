  <rect x="270" y="98" width="200" height="30" rx="6" fill="#ffd9a0"/>
  <text x="370" y="118" font-size="12.5" fill="#2e2e38" text-anchor="middle">專屬身分＋雲端電腦＋瀏覽器</text>
