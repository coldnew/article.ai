<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="system-ui, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#faf9f5"/>
