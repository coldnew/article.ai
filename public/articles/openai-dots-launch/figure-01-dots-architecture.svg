  <text x="270" y="266" font-size="12" fill="#ffd9a0">還沒開口，就先把成果交出</text>
  <rect x="510" y="55" width="220" height="275" rx="10" fill="#fff" stroke="#e8e6dc"/>
  <text x="530" y="85" font-size="14" font-weight="bold" fill="#1b365d">它能碰到什麼</text>
