<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#faf9f5"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#141413">私有記憶 vs 共享記憶：不拆開，第三週就漂</text>
  <rect x="40" y="52" width="260" height="200" rx="10" fill="#ffffff" stroke="#1b365d" stroke-width="1.5"/>
  <text x="170" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b365d">私有記憶（每隻 Bot）</text>
  <text x="170" y="104" text-anchor="middle" font-size="12" fill="#141413">自己的任務上下文</text>
  <text x="170" y="126" text-anchor="middle" font-size="12" fill="#141413">進行中的分支與假設</text>
  <text x="170" y="148" text-anchor="middle" font-size="12" fill="#141413">個人偏好（語氣、格式）</text>
  <text x="170" y="178" text-anchor="middle" font-size="12" fill="#6b6a64">只給自己看，不污染別人</text>
  <text x="170" y="228" text-anchor="middle" font-size="12" fill="#6b6a64">⇅ 守門員定期收割：經驗 → 共享</text>
  <rect x="340" y="52" width="260" height="200" rx="10" fill="#ffffff" stroke="#8a5a2b" stroke-width="1.5"/>
  <text x="470" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a2b">共享記憶（全隊共用）</text>
  <text x="470" y="104" text-anchor="middle" font-size="12" fill="#141413">架構決策與編碼標準</text>
  <text x="470" y="126" text-anchor="middle" font-size="12" fill="#141413">踩坑紀錄（錯過一次就寫入）</text>
  <text x="470" y="148" text-anchor="middle" font-size="12" fill="#141413">skill 化後的驗證流程</text>
  <text x="470" y="178" text-anchor="middle" font-size="12" fill="#6b6a64">新人（新 Bot）上線即繼承</text>
  <text x="470" y="228" text-anchor="middle" font-size="12" fill="#6b6a64">⇅ 新標準寫進 skill，不當一次性聊天</text>
  <rect x="40" y="272" width="560" height="64" rx="10" fill="#1b365d"/>
  <text x="320" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#faf9f5">混在一起的下場（第三週漂移三件套）</text>
  <text x="320" y="318" text-anchor="middle" font-size="12" fill="#faf9f5">語氣變了 ・ 舊活重做 ・ 週一改過的錯還在犯</text>
</svg>
