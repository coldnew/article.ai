<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="720" height="340" fill="#faf9f5"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#141413">四類中間人攻擊：router 看得到全部明文</text>
  <rect x="30" y="60" width="150" height="60" rx="8" fill="#fff" stroke="#1b365d" stroke-width="2"/>
  <text x="105" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#141413">你的 Agent</text>
  <text x="105" y="105" text-anchor="middle" font-size="12" fill="#6b6a64">client</text>
  <rect x="285" y="60" width="150" height="60" rx="8" fill="#fde8e8" stroke="#b3261e" stroke-width="2"/>
  <text x="360" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#b3261e">惡意 Router</text>
  <text x="360" y="105" text-anchor="middle" font-size="12" fill="#6b6a64">終止 TLS・明文經手</text>
  <rect x="540" y="60" width="150" height="60" rx="8" fill="#fff" stroke="#1b365d" stroke-width="2"/>
  <text x="615" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#141413">上游模型</text>
  <text x="615" y="105" text-anchor="middle" font-size="12" fill="#6b6a64">OpenAI / Anthropic</text>
  <line x1="180" y1="90" x2="285" y2="90" stroke="#1b365d" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="435" y1="90" x2="540" y2="90" stroke="#1b365d" stroke-width="2" marker-end="url(#ah)"/>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs>
  <g font-size="13" fill="#141413">
    <rect x="30" y="150" width="330" height="72" rx="8" fill="#fff" stroke="#e8e6dc"/>
    <text x="46" y="174" font-weight="bold" fill="#b3261e">AC-1 回應側注入（主動改）</text>
    <text x="46" y="196" font-size="12" fill="#6b6a64">把上游回傳的 tool call 換成惡意指令</text>
    <text x="46" y="212" font-size="12" fill="#6b6a64">例：正常安裝網址 → 駭客控制端點</text>
    <rect x="360" y="150" width="330" height="72" rx="8" fill="#fff" stroke="#e8e6dc"/>
    <text x="376" y="174" font-weight="bold" fill="#b3261e">AC-2 被動竊密（只看不改）</text>
    <text x="376" y="196" font-size="12" fill="#6b6a64">API key、system prompt、憑證全經過它</text>
    <text x="376" y="212" font-size="12" fill="#6b6a64">例：17 組碰了研究員的 AWS 誘餌憑證</text>
    <rect x="30" y="234" width="330" height="72" rx="8" fill="#fff" stroke="#e8e6dc"/>
    <text x="46" y="258" font-weight="bold" fill="#b3261e">AC-1.a 依賴定向注入（閃避型）</text>
    <text x="46" y="280" font-size="12" fill="#6b6a64">只對特定依賴下手，平時裝乖</text>
    <text x="46" y="296" font-size="12" fill="#6b6a64">例：等滿 50 次呼叫才發作</text>
    <rect x="360" y="234" width="330" height="72" rx="8" fill="#fff" stroke="#e8e6dc"/>
    <text x="376" y="258" font-weight="bold" fill="#b3261e">AC-1.b 條件投遞（閃避型）</text>
    <text x="376" y="280" font-size="12" fill="#6b6a64">符合觸發條件才投惡意內容</text>
    <text x="376" y="296" font-size="12" fill="#6b6a64">2 台野外 router 已部署此類閃避</text>
  </g>
</svg>
