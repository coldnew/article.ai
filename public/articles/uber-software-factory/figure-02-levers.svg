<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="-apple-system, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <rect x="0" y="0" width="900" height="430" rx="12" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">三組優化槓桿：修掉前，先別付錢</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#64748b">依 Uber 部落格 Figure 7、Figure 8、Figure 10 數據本站重繪</text>

  <!-- Panel A -->
  <rect x="20" y="72" width="273" height="330" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="156" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">MCP schema 稅</text>
  <text x="156" y="120" text-anchor="middle" font-size="12" fill="#64748b">100+ 工具預載進每個 session</text>
  <rect x="40" y="134" width="233" height="52" rx="8" fill="#fee2e2"/>
  <text x="156" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">直接載入：約 50K–70K token</text>
  <text x="156" y="173" text-anchor="middle" font-size="12" fill="#b91c1c">且每 turn 重送一次</text>
  <rect x="40" y="194" width="233" height="52" rx="8" fill="#dcfce7"/>
  <text x="156" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">CLI＋tool search：近零</text>
  <text x="156" y="233" text-anchor="middle" font-size="12" fill="#15803d">呼叫時動態解析、按需載入</text>
  <text x="156" y="272" text-anchor="middle" font-size="12.5" fill="#334155">SaaS 廠商一個 server</text>
  <text x="156" y="290" text-anchor="middle" font-size="12.5" fill="#334155">就塞 34–49 個工具（約 22K token）</text>
  <text x="156" y="312" text-anchor="middle" font-size="12.5" fill="#334155">掛兩三個＝還沒開工</text>
  <text x="156" y="330" text-anchor="middle" font-size="12.5" fill="#334155">就先背一整個檔案的稅</text>
  <text x="156" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">→ 同一 gateway、同一招式治</text>
  <text x="156" y="386" text-anchor="middle" font-size="12" fill="#64748b">1,000+ server 全部走 CLI＋skill 封裝</text>

  <!-- Panel B -->
  <rect x="313" y="72" width="273" height="330" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="449" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Code-mode 批量</text>
  <text x="449" y="120" text-anchor="middle" font-size="12" fill="#64748b">同一個 SQL 查詢，兩種走法</text>
  <rect x="333" y="134" width="233" height="52" rx="8" fill="#fee2e2"/>
  <text x="449" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">標準 MCP：N 個 model turn</text>
  <text x="449" y="173" text-anchor="middle" font-size="12" fill="#b91c1c">提交＋輪詢 2–5 次＋取結果</text>
  <rect x="333" y="194" width="233" height="52" rx="8" fill="#dcfce7"/>
  <text x="449" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Code-mode：1 段腳本</text>
  <text x="449" y="233" text-anchor="middle" font-size="12" fill="#15803d">迴圈在 subprocess，只回摘要</text>
  <text x="449" y="272" text-anchor="middle" font-size="12.5" fill="#334155">5 組相同查詢實測：</text>
  <text x="449" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">−55% ～ −71%，批次 &gt;90%</text>
  <text x="449" y="316" text-anchor="middle" font-size="12" fill="#64748b">小結果集也省＝省的是輪詢</text>
  <text x="449" y="334" text-anchor="middle" font-size="12" fill="#64748b">開銷，不是資料量</text>
  <text x="449" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">→ 25+ 預建 skill 當預設路徑</text>
  <text x="449" y="386" text-anchor="middle" font-size="12" fill="#64748b">常用 MCP 各一個 code-mode 封裝</text>

  <!-- Panel C -->
  <rect x="606" y="72" width="273" height="330" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="742" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Graph 接地</text>
  <text x="742" y="120" text-anchor="middle" font-size="12" fill="#64748b">同一題目、同一模型</text>
  <rect x="626" y="134" width="233" height="52" rx="8" fill="#dcfce7"/>
  <text x="742" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">有 Context Graph：38 秒答對</text>
  <text x="742" y="173" text-anchor="middle" font-size="12" fill="#15803d">查到 50+ 分析師用的表</text>
  <rect x="626" y="194" width="233" height="52" rx="8" fill="#fee2e2"/>
  <text x="742" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">無接地：20 分 09 秒答錯</text>
  <text x="742" y="233" text-anchor="middle" font-size="12" fill="#b91c1c">2 subagent＋3 錯誤＋錯誤結論</text>
  <text x="742" y="272" text-anchor="middle" font-size="12.5" fill="#334155">沒接地的 agent 不是慢</text>
  <text x="742" y="290" text-anchor="middle" font-size="12.5" fill="#334155">是「貴且錯」：膨脹的上下文</text>
  <text x="742" y="308" text-anchor="middle" font-size="12.5" fill="#334155">拿去多找了幾個地方</text>
  <text x="742" y="330" text-anchor="middle" font-size="12.5" fill="#334155">然後錯得更貴</text>
  <text x="742" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">→ 2,400 萬節點、30+ 系統</text>
  <text x="742" y="386" text-anchor="middle" font-size="12" fill="#64748b">小團隊版＝常用表索引先行</text>
</svg>
