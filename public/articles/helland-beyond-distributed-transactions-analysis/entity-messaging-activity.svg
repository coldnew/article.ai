<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="sans-serif">
  <title>Helland 三件套：實體、訊息、活動</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#b3541e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="420" rx="12" fill="#fafafa"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#222">實體 × 訊息 × 活動：Helland 三件套</text>
  <text x="30" y="56" font-size="13" fill="#666">交易不出實體邊界；實體之間只靠非同步訊息；每個實體用活動記住夥伴狀態</text>

  <!-- Entity A -->
  <g>
    <rect x="30" y="80" width="240" height="220" rx="10" fill="#e8f1fb" stroke="#2f6fb2" stroke-width="2"/>
    <text x="46" y="108" font-size="15" font-weight="bold" fill="#2f6fb2">實體 A（訂單 #1042）</text>
    <text x="46" y="130" font-size="12" fill="#444">鍵：order-1042</text>
    <rect x="46" y="142" width="208" height="52" rx="6" fill="#ffffff" stroke="#2f6fb2" stroke-dasharray="5 4"/>
    <text x="58" y="163" font-size="13" fill="#222">交易 T1：原子更新</text>
    <text x="58" y="182" font-size="12" fill="#555">品項＋金額＋狀態一次提交</text>
    <rect x="46" y="202" width="208" height="82" rx="6" fill="#fff7e8" stroke="#b3541e" stroke-width="1.5"/>
    <text x="58" y="223" font-size="13" font-weight="bold" fill="#b3541e">活動：對倉庫 W-7</text>
    <text x="58" y="242" font-size="12" fill="#444">已送預留請求（暫定）</text>
    <text x="58" y="260" font-size="12" fill="#444">等待確認／取消，重送冪等</text>
  </g>

  <!-- Entity B -->
  <g>
    <rect x="610" y="80" width="240" height="220" rx="10" fill="#e9f6ec" stroke="#2e7d46" stroke-width="2"/>
    <text x="626" y="108" font-size="15" font-weight="bold" fill="#2e7d46">實體 B（倉庫 W-7）</text>
    <text x="626" y="130" font-size="12" fill="#444">鍵：warehouse-W-7</text>
    <rect x="626" y="142" width="208" height="52" rx="6" fill="#ffffff" stroke="#2e7d46" stroke-dasharray="5 4"/>
    <text x="638" y="163" font-size="13" fill="#222">交易 T2：原子更新</text>
    <text x="638" y="182" font-size="12" fill="#555">庫存預留，獨立提交</text>
    <rect x="626" y="202" width="208" height="82" rx="6" fill="#fff7e8" stroke="#b3541e" stroke-width="1.5"/>
    <text x="638" y="223" font-size="13" font-weight="bold" fill="#b3541e">活動：對訂單 #1042</text>
    <text x="638" y="242" font-size="12" fill="#444">已收請求，去重後執行</text>
    <text x="638" y="260" font-size="12" fill="#444">回送確認訊息</text>
  </g>

  <!-- Message arrows -->
  <line x1="270" y1="150" x2="600" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="330" y="138" font-size="12" fill="#222">訊息：預留 3 件（交易式入隊）</text>
  <line x1="600" y1="240" x2="270" y2="240" stroke="#b3541e" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrD)"/>
  <text x="330" y="262" font-size="12" fill="#b3541e">確認（可能重送／亂序，冪等吸收）</text>

  <!-- No distributed txn -->
  <g>
    <line x1="270" y1="310" x2="610" y2="310" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="300" y="302" font-size="13" font-weight="bold" fill="#c0392b">沒有橫跨 A、B 的分散式交易 ✕</text>
  </g>

  <g>
    <rect x="30" y="326" width="820" height="66" rx="8" fill="#ffffff" stroke="#999"/>
    <text x="46" y="350" font-size="13" fill="#222">規則：訊息在發送端交易提交前，目的地不可見（對發送交易非同步）；投遞為至少一次，順序可能亂，接收端一律冪等處理。</text>
    <text x="46" y="372" font-size="12" fill="#666">對應 2007 年 CIDR 版第 3 節（Messaging）與第 5 節（Activities）；重分區時訊息會追著搬家的實體跑。</text>
  </g>
</svg>
