<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect x="0" y="0" width="720" height="430" fill="#faf9f5"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#141413">入門職缺漲跌：跌的是資訊處理，漲的是面對人</text>
  <text x="24" y="58" font-size="12" fill="#6b6a64">DSIT＋LinkedIn 英國快照，2026 年 4 月，38 個入門職業中 30 跌 8 漲</text>
  <line x1="360" y1="76" x2="360" y2="398" stroke="#999" stroke-width="1"/>
  <text x="360" y="414" font-size="11" fill="#6b6a64" text-anchor="middle">0%</text>

  <text x="350" y="100" font-size="13" fill="#141413" text-anchor="end">會計 −29%</text>
  <rect x="214" y="86" width="146" height="20" fill="#c0392b" rx="3"/>
  <text x="350" y="130" font-size="13" fill="#141413" text-anchor="end">平面設計 −28%</text>
  <rect x="219" y="116" width="141" height="20" fill="#c0392b" rx="3"/>
  <text x="350" y="160" font-size="13" fill="#141413" text-anchor="end">軟體工程師 −27%</text>
  <rect x="224" y="146" width="136" height="20" fill="#c0392b" rx="3"/>
  <text x="350" y="190" font-size="13" fill="#141413" text-anchor="end">產品經理 −24%</text>
  <rect x="239" y="176" width="121" height="20" fill="#c0392b" rx="3"/>
  <text x="350" y="220" font-size="13" fill="#141413" text-anchor="end">資料分析 −15%</text>
  <rect x="284" y="206" width="76" height="20" fill="#c0392b" rx="3"/>
  <text x="350" y="250" font-size="13" fill="#141413" text-anchor="end">法務助理 −14%</text>
  <rect x="290" y="236" width="70" height="20" fill="#c0392b" rx="3"/>
  <text x="350" y="280" font-size="13" fill="#141413" text-anchor="end">資料工程 −11%</text>
  <rect x="305" y="266" width="55" height="20" fill="#c0392b" rx="3"/>

  <text x="370" y="316" font-size="13" fill="#141413">零售店員 +25%</text>
  <rect x="360" y="302" width="126" height="20" fill="#2e7d32" rx="3"/>
  <text x="370" y="346" font-size="13" fill="#141413">銷售開發代表 +17%</text>
  <rect x="360" y="332" width="86" height="20" fill="#2e7d32" rx="3"/>
