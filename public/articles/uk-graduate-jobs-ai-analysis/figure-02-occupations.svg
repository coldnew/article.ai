  <rect x="360" y="362" width="81" height="20" fill="#2e7d32" rx="3"/>

  <text x="24" y="414" font-size="11" fill="#6b6a64">本站自繪，數據出自 GOV.UK〈A snapshot of entry-level hiring in the UK〉Figure 2。官方原話：與 AI 相關但「還不是因果證據」。</text>
</svg>
