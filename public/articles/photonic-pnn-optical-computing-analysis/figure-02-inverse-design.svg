<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="360" rx="12" fill="#f8fafc"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">逆向設計如何省算力：N＋C 次模擬取代 L 次全數據集模擬</text>

  <!-- step 1 -->
  <rect x="20" y="50" width="220" height="200" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="74" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">1．前向：只跑 N 次</text>
  <text x="130" y="98" font-size="11" fill="#334155" text-anchor="middle">每個輸入埠跑一次 3D-FDTD</text>
  <text x="130" y="116" font-size="11" fill="#334155" text-anchor="middle">MNIST：N＝10</text>
  <text x="130" y="134" font-size="11" fill="#334155" text-anchor="middle">MedNIST：N＝15</text>
  <rect x="40" y="150" width="180" height="40" rx="6" fill="#dbeafe"/>
  <text x="130" y="167" font-size="11" fill="#1e40af" text-anchor="middle">得基底場 E1…EN</text>
  <text x="130" y="183" font-size="11" fill="#1e40af" text-anchor="middle">利用 Maxwell 線性疊加</text>
  <text x="130" y="220" font-size="11" fill="#64748b" text-anchor="middle">RTX 5090 單次約 30 秒</text>

  <!-- arrow -->
  <line x1="250" y1="150" x2="280" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- step 2 -->
  <rect x="290" y="50" width="220" height="200" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="400" y="74" font-size="13" font-weight="bold" fill="#5b21b6" text-anchor="middle">2．重建＋反向：加 C 次</text>
  <text x="400" y="98" font-size="11" fill="#334155" text-anchor="middle">全數據集場＝Dᵀ·E（矩陣乘）</text>
  <text x="400" y="116" font-size="11" fill="#334155" text-anchor="middle">L 達 5～7 萬也不多跑 FDTD</text>
  <text x="400" y="134" font-size="11" fill="#334155" text-anchor="middle">每類一次伴隨模擬求梯度</text>
  <rect x="310" y="150" width="180" height="40" rx="6" fill="#ede9fe"/>
  <text x="400" y="167" font-size="11" fill="#5b21b6" text-anchor="middle">每 epoch 只要 N＋C 次</text>
  <text x="400" y="183" font-size="11" fill="#5b21b6" text-anchor="middle">20 次／21 次（vs 數萬次）</text>
  <text x="400" y="220" font-size="11" fill="#64748b" text-anchor="middle">GPU 平行＋排程再加速</text>

  <!-- step 3 -->
  <rect x="520" y="50" width="220" height="200" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="630" y="74" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">3．模擬≠實測</text>
  <text x="630" y="98" font-size="11" fill="#334155" text-anchor="middle">MNIST：97.8% → 89%</text>
  <text x="630" y="116" font-size="11" fill="#334155" text-anchor="middle">MedNIST：99.1% → 90%</text>
  <rect x="540" y="130" width="180" height="40" rx="6" fill="#fee2e2"/>
  <text x="630" y="147" font-size="11" fill="#991b1b" text-anchor="middle">差距來自製程＋耦合擾動</text>
  <text x="630" y="163" font-size="11" fill="#991b1b" text-anchor="middle">輸出正確埠僅約 50% 能量</text>
  <text x="630" y="200" font-size="11" fill="#334155" text-anchor="middle">訓練仍耗時：29.7h／56.3h</text>
  <text x="630" y="220" font-size="11" fill="#334155" text-anchor="middle">（單 RTX 5090 節點）</text>

  <!-- bottom bar -->
  <rect x="20" y="266" width="720" height="74" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="380" y="290" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">讀貼文時的三個核對點：單波長（非多色）・固定小分類器（非通用 GPU）・實驗 89–90%（非 90–99% 通吃）</text>
  <text x="380" y="312" font-size="11" fill="#475569" text-anchor="middle">每體素可訓練、約 40 萬參數／mm²、最小特徵 80 nm：密度故事成立，但只在 1550 nm、SOI 被動推理條件下成立</text>
</svg>
