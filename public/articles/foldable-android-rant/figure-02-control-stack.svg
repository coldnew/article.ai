<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="system-ui, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="#faf9f5"/>
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#141413">軟硬掌控度：蘋果 vs Android（作者主張示意）</text>
  <g font-size="13">
    <text x="180" y="62" text-anchor="middle" font-weight="bold" fill="#141413">Apple：一條線</text>
    <rect x="60" y="76" width="240" height="40" rx="6" fill="#1b365d"/>
    <text x="180" y="101" text-anchor="middle" fill="#fff">硬體（自研＋鉸鏈）</text>
    <rect x="60" y="120" width="240" height="40" rx="6" fill="#1b365d" opacity="0.8"/>
    <text x="180" y="145" text-anchor="middle" fill="#fff">系統 API（iOS 27 分割顯示）</text>
    <rect x="60" y="164" width="240" height="40" rx="6" fill="#1b365d" opacity="0.6"/>
    <text x="180" y="189" text-anchor="middle" fill="#fff">開發者（一套适配）</text>
    <rect x="60" y="208" width="240" height="40" rx="6" fill="#1b365d" opacity="0.4"/>
    <text x="180" y="233" text-anchor="middle" fill="#fff">用戶（不适配就罵 App）</text>
    <text x="540" y="62" text-anchor="middle" font-weight="bold" fill="#141413">Android：斷成四截</text>
    <rect x="420" y="76" width="240" height="40" rx="6" fill="#fff" stroke="#8a5a2b" stroke-width="1.5"/>
    <text x="540" y="101" text-anchor="middle" fill="#141413">硬體（三星先跑、魔改 AOSP）</text>
    <rect x="420" y="120" width="240" height="40" rx="6" fill="#fff" stroke="#8a5a2b" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="540" y="145" text-anchor="middle" fill="#141413">系統 API（慢硬體 1–2 年）</text>
    <rect x="420" y="164" width="240" height="40" rx="6" fill="#fff" stroke="#8a5a2b" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="540" y="189" text-anchor="middle" fill="#141413">開發者（每家 OEM 各一套）</text>
    <rect x="420" y="208" width="240" height="40" rx="6" fill="#fff" stroke="#8a5a2b" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="540" y="233" text-anchor="middle" fill="#141413">用戶（罵三星／OV 不行）</text>
  </g>
  <text x="180" y="278" text-anchor="middle" font-size="12" fill="#6b6a64">壓力指向 App → 搶著适配</text>
  <text x="540" y="278" text-anchor="middle" font-size="12" fill="#6b6a64">壓力被 OEM 分攤掉 → 沒人适配</text>
  <text x="360" y="312" text-anchor="middle" font-size="12" fill="#6b6a64">另有 Pixel 自 AOSP 分叉、裁員與 ChatGPT 衝擊造成的內部失序（作者自述，未獨立驗證）</text>
  <text x="360" y="336" text-anchor="middle" font-size="11" fill="#6b6a64">本站自繪，整理自 BinaryTree 貼文四點主張</text>
</svg>
