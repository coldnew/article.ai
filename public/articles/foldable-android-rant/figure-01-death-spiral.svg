<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a5a2b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="340" fill="#faf9f5"/>
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#141413">Android 獨特功能的死亡螺旋</text>
  <ellipse cx="360" cy="180" rx="250" ry="120" fill="none" stroke="#8a5a2b" stroke-width="2" stroke-dasharray="8 5"/>
  <g font-size="13" fill="#141413">
    <rect x="270" y="36" width="180" height="44" rx="8" fill="#fff" stroke="#8a5a2b" stroke-width="1.5"/>
    <text x="360" y="54" text-anchor="middle">開發者不願逐廠适配</text>
    <text x="360" y="71" text-anchor="middle" font-size="11" fill="#6b6a64">華米歐維＋三星＋Pixel</text>
    <rect x="492" y="158" width="180" height="44" rx="8" fill="#fff" stroke="#8a5a2b" stroke-width="1.5"/>
    <text x="582" y="176" text-anchor="middle">用戶不愛買</text>
    <text x="582" y="193" text-anchor="middle" font-size="11" fill="#6b6a64">體驗只到「能看的程度」</text>
    <rect x="270" y="260" width="180" height="44" rx="8" fill="#fff" stroke="#8a5a2b" stroke-width="1.5"/>
    <text x="360" y="278" text-anchor="middle">市佔越縮越小</text>
    <text x="360" y="295" text-anchor="middle" font-size="11" fill="#6b6a64">摺疊屏 &lt; 2%（IDC）</text>
    <rect x="48" y="158" width="180" height="44" rx="8" fill="#fff" stroke="#8a5a2b" stroke-width="1.5"/>
    <text x="138" y="176" text-anchor="middle">更沒動機适配</text>
    <text x="138" y="193" text-anchor="middle" font-size="11" fill="#6b6a64">罵的是三星不行</text>
  </g>
  <g font-size="12" fill="#8a5a2b" font-weight="bold">
    <text x="505" y="80" text-anchor="middle">App 品質差</text>
    <text x="505" y="262" text-anchor="middle">份額再縮水</text>
    <text x="215" y="262" text-anchor="middle">惡性循環</text>
    <text x="215" y="80" text-anchor="middle">回到起點</text>
  </g>
  <text x="360" y="328" text-anchor="middle" font-size="12" fill="#6b6a64">唯一破口：等蘋果出同類功能，大家搶著适配（作者主張）</text>
</svg>
