<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="-apple-system, 'Noto Sans TC', 'PingFang TC', sans-serif">
  <rect x="0" y="0" width="960" height="430" rx="16" fill="#fff7f7"/>
  <text x="480" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">「伸舌頭 40 秒降皮質醇」溯源鏈：每一步都在失真</text>

  <!-- Node 1 -->
  <g>
    <rect x="20" y="70" width="205" height="220" rx="12" fill="#ffffff" stroke="#f43f5e" stroke-width="2"/>
    <rect x="20" y="70" width="205" height="34" rx="12" fill="#f43f5e"/>
    <rect x="20" y="90" width="205" height="14" fill="#f43f5e"/>
    <text x="122" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">起點：n = 1 軼事</text>
    <text x="122" y="130" text-anchor="middle" font-size="12.5" fill="#374151">Mount Sinai 神經科醫師</text>
    <text x="122" y="150" text-anchor="middle" font-size="12.5" fill="#374151">門診隨口一句玩笑</text>
    <text x="122" y="170" text-anchor="middle" font-size="12.5" fill="#374151">單一病人兩週後</text>
    <text x="122" y="190" text-anchor="middle" font-size="12.5" fill="#374151">皮質醇「回到正常」</text>
    <text x="122" y="216" text-anchor="middle" font-size="12" fill="#6b7280">晝夜節律／睡眠／壓力</text>
    <text x="122" y="234" text-anchor="middle" font-size="12" fill="#6b7280">皆未控制</text>
    <rect x="45" y="248" width="155" height="26" rx="13" fill="#fee2e2"/>
    <text x="122" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">個案 ≠ 療效證據</text>
  </g>

  <!-- Arrow 1 -->
  <text x="238" y="185" text-anchor="middle" font-size="26" fill="#9ca3af">›</text>

  <!-- Node 2 -->
  <g>
    <rect x="258" y="70" width="205" height="220" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="258" y="70" width="205" height="34" rx="12" fill="#f59e0b"/>
    <rect x="258" y="90" width="205" height="14" fill="#f59e0b"/>
    <text x="360" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">轉述：IG 二手影片</text>
    <text x="360" y="130" text-anchor="middle" font-size="12.5" fill="#374151">物理治療師 Ginader</text>
    <text x="360" y="150" text-anchor="middle" font-size="12.5" fill="#374151">轉述軼事後加碼出</text>
    <text x="360" y="170" text-anchor="middle" font-size="12.5" fill="#374151">「伸 40 秒」具體數字</text>
    <text x="360" y="190" text-anchor="middle" font-size="12.5" fill="#374151">病毒式傳播（2026 年 6 月）</text>
    <text x="360" y="216" text-anchor="middle" font-size="12" fill="#6b7280">40 秒在原始軼事中</text>
    <text x="360" y="234" text-anchor="middle" font-size="12" fill="#6b7280">找不到出處</text>
    <rect x="283" y="248" width="155" height="26" rx="13" fill="#fef3c7"/>
    <text x="360" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">數字無源頭</text>
  </g>

  <!-- Arrow 2 -->
  <text x="476" y="185" text-anchor="middle" font-size="26" fill="#9ca3af">›</text>

  <!-- Node 3 -->
  <g>
    <rect x="496" y="70" width="205" height="220" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="496" y="70" width="205" height="34" rx="12" fill="#f59e0b"/>
    <rect x="496" y="90" width="205" height="14" fill="#f59e0b"/>
    <text x="598" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">機制：跳接迷走神經</text>
    <text x="598" y="130" text-anchor="middle" font-size="12.5" fill="#374151">耳部「電刺激」taVNS</text>
    <text x="598" y="150" text-anchor="middle" font-size="12.5" fill="#374151">被偷換成「伸舌動作」</text>
    <text x="598" y="170" text-anchor="middle" font-size="12.5" fill="#374151">伸舌運動神經是舌下神經</text>
    <text x="598" y="190" text-anchor="middle" font-size="12.5" fill="#374151">（CN XII），非迷走神經</text>
    <text x="598" y="216" text-anchor="middle" font-size="12" fill="#6b7280">Warren 2019 甚至顯示</text>
    <text x="598" y="234" text-anchor="middle" font-size="12" fill="#6b7280">「減緩下降」而非降低</text>
    <rect x="521" y="248" width="155" height="26" rx="13" fill="#fef3c7"/>
    <text x="598" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">文獻不可外推</text>
  </g>

  <!-- Arrow 3 -->
  <text x="714" y="185" text-anchor="middle" font-size="26" fill="#9ca3af">›</text>

  <!-- Node 4 -->
  <g>
    <rect x="734" y="70" width="205" height="220" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="734" y="70" width="205" height="34" rx="12" fill="#10b981"/>
    <rect x="734" y="90" width="205" height="14" fill="#10b981"/>
    <text x="836" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">終點：事實查核</text>
    <text x="836" y="130" text-anchor="middle" font-size="12.5" fill="#374151">The Week：FACT False</text>
    <text x="836" y="150" text-anchor="middle" font-size="12.5" fill="#374151">神經科醫師：無強證據</text>
    <text x="836" y="170" text-anchor="middle" font-size="12.5" fill="#374151">Medindia：無科學證據</text>
    <text x="836" y="190" text-anchor="middle" font-size="12.5" fill="#374151">主觀放鬆感可成立</text>
    <text x="836" y="216" text-anchor="middle" font-size="12" fill="#6b7280">降皮質醇不可成立</text>
    <text x="836" y="234" text-anchor="middle" font-size="12" fill="#6b7280">玩梗無害，治病不行</text>
    <rect x="759" y="248" width="155" height="26" rx="13" fill="#d1fae5"/>
    <text x="836" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">感受真・療效假</text>
  </g>

  <!-- Footer -->
  <text x="480" y="330" text-anchor="middle" font-size="13" fill="#4b5563">舌頭動作 ≠ 耳部電刺激：最接近的 taVNS 文獻（Warren 2019，N=17；Cuberos Paredes 2025，N=12）樣本極小，且刺激部位與方式完全不同。</text>
  <text x="480" y="354" text-anchor="middle" font-size="13" fill="#4b5563">皮質醇有強晝夜節律——單一時間點「回到正常」在無對照個案中不具解釋力。</text>
  <rect x="270" y="372" width="420" height="30" rx="15" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="480" y="392" text-anchor="middle" font-size="12.5" fill="#6b7280">本站自繪溯源圖｜敘事鏈整理自 Indian Express、The Week、PubMed／PMC 文獻</text>
</svg>
