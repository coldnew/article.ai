<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="760" height="380" rx="12" fill="#f8fafc"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">論文的 8 年是怎麼算出來的：30 歲起，5 個低風險習慣全拿 vs 只拿 0–1 個</text>

  <!-- men -->
  <text x="120" y="70" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">男性（30 歲起預期餘命）</text>
  <rect x="30" y="84" width="200" height="30" rx="6" fill="#e2e8f0"/>
  <text x="40" y="104" font-size="11" fill="#334155">0–1 個：41.7 年</text>
  <rect x="30" y="120" width="242" height="30" rx="6" fill="#2563eb"/>
  <text x="40" y="140" font-size="11" font-weight="bold" fill="#ffffff">5 個全拿：50.5 年（＋8.8）</text>
  <text x="30" y="166" font-size="11" fill="#64748b">心血管貢獻 2.4 年（27%）・癌症 2.6 年（30%）</text>

  <!-- women -->
  <text x="120" y="200" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">女性（30 歲起預期餘命）</text>
  <rect x="30" y="214" width="227" height="30" rx="6" fill="#e2e8f0"/>
  <text x="40" y="234" font-size="11" fill="#334155">0–1 個：47.3 年</text>
  <rect x="30" y="250" width="266" height="30" rx="6" fill="#db2777"/>
  <text x="40" y="270" font-size="11" font-weight="bold" fill="#ffffff">5 個全拿：55.4 年（＋8.1）</text>
  <text x="30" y="296" font-size="11" fill="#64748b">心血管貢獻 3.7 年（46%）・癌症 0.9 年（11%）</text>

  <!-- right: method -->
  <rect x="420" y="56" width="320" height="252" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="580" y="80" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">三個數據源拼出的估算</text>
  <rect x="440" y="94" width="280" height="34" rx="6" fill="#dbeafe"/>
  <text x="580" y="116" font-size="11" fill="#1e40af" text-anchor="middle">CKB 48.7 萬人前瞻隊列（死亡 4.2 萬）</text>
  <rect x="440" y="134" width="280" height="34" rx="6" fill="#dbeafe"/>
  <text x="580" y="156" font-size="11" fill="#1e40af" text-anchor="middle">全國營養調查習慣盛行率（17 萬人）</text>
  <rect x="440" y="174" width="280" height="34" rx="6" fill="#dbeafe"/>
  <text x="580" y="196" font-size="11" fill="#1e40af" text-anchor="middle">全球疾病負擔死亡率＋壽命表法</text>
  <rect x="440" y="218" width="280" height="66" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="580" y="238" font-size="11" fill="#713f12" text-anchor="middle">觀察性研究：是關聯非因果；</text>
  <text x="580" y="255" font-size="11" fill="#713f12" text-anchor="middle">50 歲起算差距約 7.7／7.6 年</text>
  <text x="580" y="272" font-size="11" fill="#713f12" text-anchor="middle">（Table S8），起點越晚越小</text>

  <text x="380" y="340" font-size="11" fill="#64748b" text-anchor="middle">數字引自 Sun et al., Lancet Public Health 2022;7(12):e994–e1004（CKB 官網同步摘要可對）</text>
  <text x="380" y="358" font-size="11" fill="#64748b" text-anchor="middle">全死因 aHR 0.38（5 個 vs 0–1 個）；作者轉述「8 年以上」與此一致，屬準確引用</text>
</svg>
