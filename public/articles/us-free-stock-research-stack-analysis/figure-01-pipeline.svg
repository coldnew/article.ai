<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="360" rx="12" fill="#f8fafc"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">六站串成一條美股研究流水線：找 → 看 → 比 → 驗</text>

  <!-- step 1 find -->
  <rect x="20" y="50" width="160" height="220" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="74" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">1．找股票</text>
  <rect x="36" y="88" width="128" height="36" rx="6" fill="#2563eb"/>
  <text x="100" y="111" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Finviz</text>
  <text x="100" y="140" font-size="11" fill="#334155" text-anchor="middle">板塊＋熱力圖</text>
  <text x="100" y="157" font-size="11" fill="#334155" text-anchor="middle">盤前掃市場炒什麼</text>
  <text x="100" y="190" font-size="11" fill="#64748b" text-anchor="middle">篩選器找候選</text>
  <text x="100" y="240" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">輸出：候選名單</text>

  <line x1="188" y1="160" x2="212" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 2 fundamentals -->
  <rect x="220" y="50" width="160" height="220" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="300" y="74" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">2．看基本面</text>
  <rect x="236" y="88" width="128" height="36" rx="6" fill="#16a34a"/>
  <text x="300" y="111" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">StockAnalysis</text>
  <text x="300" y="140" font-size="11" fill="#334155" text-anchor="middle">Revenue／EPS／FCF</text>
  <text x="300" y="157" font-size="11" fill="#334155" text-anchor="middle">Margin／股數／預期</text>
  <text x="300" y="190" font-size="11" fill="#64748b" text-anchor="middle">一頁看完一家公司</text>
  <text x="300" y="240" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">輸出：財務快照</text>

  <line x1="388" y1="160" x2="412" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 3 history + compare -->
  <rect x="420" y="50" width="160" height="220" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="500" y="74" font-size="13" font-weight="bold" fill="#5b21b6" text-anchor="middle">3．看歷史＋比</text>
  <rect x="436" y="88" width="128" height="30" rx="6" fill="#7c3aed"/>
  <text x="500" y="108" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Macrotrends</text>
  <text x="500" y="130" font-size="11" fill="#334155" text-anchor="middle">10 年利潤率／估值位置</text>
  <rect x="436" y="142" width="128" height="30" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="500" y="162" font-size="11" font-weight="bold" fill="#5b21b6" text-anchor="middle">Koyfin（免費版）</text>
  <text x="500" y="184" font-size="11" fill="#334155" text-anchor="middle">跨股比較＋宏觀圖</text>
  <rect x="436" y="196" width="128" height="30" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="500" y="216" font-size="11" font-weight="bold" fill="#5b21b6" text-anchor="middle">CompaniesMarketCap</text>
  <text x="500" y="240" font-size="11" fill="#334155" text-anchor="middle">市值／行業排名定位</text>

  <line x1="588" y1="160" x2="612" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 4 verify -->
  <rect x="620" y="50" width="120" height="220" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
  <text x="680" y="74" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4．驗原始</text>
  <rect x="632" y="88" width="96" height="36" rx="6" fill="#ffffff"/>
  <text x="680" y="104" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">SEC</text>
  <text x="680" y="118" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">EDGAR</text>
  <text x="680" y="140" font-size="11" fill="#e2e8f0" text-anchor="middle">財報／8-K</text>
  <text x="680" y="157" font-size="11" fill="#e2e8f0" text-anchor="middle">內部人交易</text>
  <text x="680" y="174" font-size="11" fill="#e2e8f0" text-anchor="middle">大股東變化</text>
  <text x="680" y="210" font-size="11" fill="#fbbf24" text-anchor="middle">聚合站數字</text>
  <text x="680" y="227" font-size="11" fill="#fbbf24" text-anchor="middle">一律回這裡對</text>
  <text x="680" y="248" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">輸出：可下注結論</text>

  <!-- bottom -->
  <rect x="20" y="286" width="720" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="380" y="308" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">作者論點：研報只是重整公開資訊，差距在串數據能力，不在訂閱費</text>
  <text x="380" y="328" font-size="11" fill="#475569" text-anchor="middle">盲點：免費額度與延遲、聚合錯誤、SEC 解讀門檻，流程不保證獲利（回覆已有人補成交量一課）</text>
</svg>
