<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="system-ui, 'Noto Sans TC', sans-serif">
  <text x="400" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#141413">同樣的「更多計算」，兩條路</text>
  <text x="400" y="50" text-anchor="middle" font-size="13" fill="#6b6a64">Raschka 的結論：短 chain-of-thought 是能力變強的副產品，不是藏 reasoning 的證據。本站自繪</text>

  <!-- left path -->
  <rect x="40" y="80" width="330" height="250" rx="10" fill="#f4f8f4" stroke="#3d7a44"/>
  <text x="205" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#3d7a44">路 A：外部思考 token</text>
  <text x="205" y="130" text-anchor="middle" font-size="12" fill="#6b6a64">chain-of-thought 當草稿紙</text>
  <g font-size="13" fill="#141413">
    <text x="60" y="162">• 中間步驟是文字 token</text>
    <text x="60" y="186">• 看得見 → 可監控、可審計</text>
    <text x="60" y="210">• 代價：token 用量大</text>
  </g>
  <rect x="60" y="228" width="290" height="78" rx="6" fill="#ffffff" stroke="#3d7a44" stroke-dasharray="5 4"/>
  <text x="205" y="252" text-anchor="middle" font-size="12" fill="#141413">例：GPT-5.6 Luna 比 Sol</text>
  <text x="205" y="272" text-anchor="middle" font-size="12" fill="#141413">多用 <tspan font-weight="700">80%</tspan> token，同樣分數</text>
  <text x="205" y="292" text-anchor="middle" font-size="12" fill="#6b6a64">沒人說 Sol 比較不可解讀</text>

  <!-- right path -->
  <rect x="430" y="80" width="330" height="250" rx="10" fill="#fdf6ec" stroke="#c26a1b"/>
  <text x="595" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#c26a1b">路 B：內部 loop（latent）</text>
  <text x="595" y="130" text-anchor="middle" font-size="12" fill="#6b6a64">同一組 block 多跑幾遍</text>
  <g font-size="13" fill="#141413">
    <text x="450" y="162">• 計算發生在 hidden state</text>
    <text x="450" y="186">• 看不見 → 文字監控器抓不到</text>
    <text x="450" y="210">• 代價：省 token，但少了可讀軌跡</text>
  </g>
  <rect x="450" y="228" width="290" height="78" rx="6" fill="#ffffff" stroke="#c26a1b" stroke-dasharray="5 4"/>
  <text x="595" y="252" text-anchor="middle" font-size="12" fill="#141413">Astra 同精度用更少 token</text>
  <text x="595" y="272" text-anchor="middle" font-size="12" fill="#141413">Pachocki：計算圖深度在</text>
  <text x="595" y="292" text-anchor="middle" font-size="12" fill="#141413">GPT-4 的 <tspan font-weight="700">兩倍以內</tspan></text>

  <!-- bottom verdict -->
  <line x1="60" y1="354" x2="740" y2="354" stroke="#e8e6dc"/>
  <text x="400" y="382" text-anchor="middle" font-size="14" fill="#141413">Raschka 的切分：真正該擔心的不是「變短」，而是「<tspan font-weight="700">故意給假的</tspan> reasoning」——目前沒有證據</text>
  <text x="400" y="406" text-anchor="middle" font-size="13" fill="#6b6a64">system card 承認 monitorability 小幅退化，但那是「短而不豐富」，不是 loop 造成的（類比 Luna／Sol）</text>
</svg>
