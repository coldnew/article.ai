<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="860" height="560" fill="#fffbeb" rx="12"/>
  <text x="430" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#78350f">Justine Tunney 1998–2026：從 BBS 少女到單檔 LLM</text>
  <text x="430" y="60" text-anchor="middle" font-size="13" fill="#92400e">星號（＊）為貼文略去、但公開紀錄可查的事件；虛線框為弱來源主張</text>

  <line x1="60" y1="120" x2="800" y2="120" stroke="#b45309" stroke-width="3"/>
  <polygon points="800,120 786,112 786,128" fill="#b45309"/>

  <g font-size="12">
    <!-- 1998 -->
    <circle cx="90" cy="120" r="8" fill="#fff" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="90" y="100" text-anchor="middle" font-weight="700" fill="#1c1917">1998</text>
    <rect x="20" y="140" width="150" height="78" fill="#ffffff" stroke="#d6d3d1" rx="8"/>
    <text x="95" y="160" text-anchor="middle" font-weight="700" fill="#1c1917">14 歲發表軟體</text>
    <text x="95" y="178" text-anchor="middle">1984＋14 自洽</text>
    <text x="95" y="194" text-anchor="middle" fill="#b91c1c">Wiki 掛 citation</text>
    <text x="95" y="208" text-anchor="middle" fill="#b91c1c">needed</text>

    <!-- 2011 -->
    <circle cx="235" cy="120" r="8" fill="#b45309"/>
    <text x="235" y="100" text-anchor="middle" font-weight="700" fill="#1c1917">2011-07</text>
    <rect x="160" y="140" width="150" height="78" fill="#ffffff" stroke="#d6d3d1" rx="8"/>
    <text x="235" y="160" text-anchor="middle" font-weight="700" fill="#1c1917">@occupywallst</text>
    <text x="235" y="178" text-anchor="middle">註冊帳號＋網域</text>
    <text x="235" y="194" text-anchor="middle">運動 main hub</text>
    <text x="235" y="208" text-anchor="middle" fill="#92400e">骨幹說法待降級</text>

    <!-- 2012 -->
    <circle cx="360" cy="120" r="8" fill="#1d4ed8"/>
    <text x="360" y="100" text-anchor="middle" font-weight="700" fill="#1c1917">2012</text>
    <rect x="285" y="140" width="150" height="78" fill="#dbeafe" stroke="#1d4ed8" rx="8"/>
    <text x="360" y="160" text-anchor="middle" font-weight="700" fill="#1e3a8a">進 Google</text>
    <text x="360" y="178" text-anchor="middle">TensorBoard 領頭</text>
    <text x="360" y="194" text-anchor="middle">Nomulus／Bazel</text>
    <text x="360" y="208" text-anchor="middle">2016 Rosehub</text>

    <!-- 2014 petition (omitted) -->
    <circle cx="470" cy="120" r="8" fill="#fff" stroke="#78716c" stroke-width="2.5"/>
    <text x="470" y="100" text-anchor="middle" font-weight="700" fill="#1c1917">2014＊</text>
    <rect x="395" y="140" width="150" height="78" fill="#f5f5f4" stroke="#a8a29e" stroke-dasharray="5 3" rx="8"/>
    <text x="470" y="160" text-anchor="middle" font-weight="700" fill="#57534e">請願事件（略去）</text>
    <text x="470" y="178" text-anchor="middle" fill="#57534e">公務員優退＋</text>
    <text x="470" y="194" text-anchor="middle" fill="#57534e">Schmidt 當 CEO</text>
    <text x="470" y="208" text-anchor="middle" fill="#57534e">最具爭議一頁</text>

    <!-- 2018 -->
    <circle cx="585" cy="120" r="8" fill="#1d4ed8"/>
    <text x="585" y="100" text-anchor="middle" font-weight="700" fill="#1c1917">2018</text>
    <rect x="515" y="140" width="140" height="78" fill="#dbeafe" stroke="#1d4ed8" rx="8"/>
    <text x="585" y="160" text-anchor="middle" font-weight="700" fill="#1e3a8a">離開 Google</text>
    <text x="585" y="178" text-anchor="middle">全職投入開源</text>
    <text x="585" y="194" text-anchor="middle">2020-06 repo</text>
    <text x="585" y="208" text-anchor="middle">公開至今 6.3 年</text>

    <!-- 2023-10-31 -->
    <circle cx="690" cy="120" r="10" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
    <text x="690" y="100" text-anchor="middle" font-weight="700" fill="#1c1917">2023-10-31</text>
    <rect x="620" y="140" width="150" height="78" fill="#fef3c7" stroke="#b45309" rx="8"/>
    <text x="695" y="160" text-anchor="middle" font-weight="700" fill="#78350f">Cosmo 3.0</text>
    <text x="695" y="178" text-anchor="middle">MIECO 資助</text>
    <text x="695" y="194" text-anchor="middle">apelink＋六系統</text>
    <text x="695" y="208" text-anchor="middle">＋雙架構胖二進位</text>

    <!-- 2023-11-29 -->
    <circle cx="795" cy="120" r="10" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
    <text x="795" y="100" text-anchor="middle" font-weight="700" fill="#1c1917">11-29</text>
    <text x="772" y="140" font-weight="700" fill="#78350f">llamafile</text>
    <text x="772" y="158" font-size="11">Mozilla 官方發布</text>
    <text x="772" y="174" font-size="11">29 天後（已驗算）</text>
    <text x="772" y="190" font-size="11">24.6K→25.9K★</text>
  </g>

  <!-- lower band: claim check summary -->
  <text x="60" y="262" font-size="15" font-weight="700" fill="#78350f">貼文 17 項主張查核縮影</text>
  <g font-size="12">
    <rect x="60" y="272" width="236" height="96" fill="#ecfdf5" stroke="#059669" rx="8"/>
    <text x="72" y="294" font-weight="700" fill="#065f46">成立（9 項）</text>
    <text x="72" y="312" fill="#1c1917">1984／jart／六系統 APE／</text>
    <text x="72" y="328" fill="#1c1917">MIECO＋Cosmo 3.0／llamafile</text>
    <text x="72" y="344" fill="#1c1917">日期／Apache 2.0／GPU＋dlopen</text>
    <text x="72" y="360" fill="#1c1917">／whisperfile</text>
    <rect x="308" y="272" width="236" height="96" fill="#fffbeb" stroke="#b45309" rx="8"/>
    <text x="320" y="294" font-weight="700" fill="#92400e">降級／部分成立（5 項）</text>
    <text x="320" y="312" fill="#1c1917">1998 弱來源／BBS 無來源／</text>
    <text x="320" y="328" fill="#1c1917">佔領骨幹誇大／SRE 無來源／</text>
    <text x="320" y="344" fill="#1c1917">五年獨力（有資助＋社群）</text>
    <rect x="556" y="272" width="224" height="96" fill="#fef2f2" stroke="#b91c1c" rx="8"/>
    <text x="568" y="294" font-weight="700" fill="#991b1b">錯誤／炒作（3 項）</text>
    <text x="568" y="312" fill="#1c1917">外號 jart（實為 Google）／</text>
    <text x="568" y="328" fill="#1c1917">blink（實名 blinkenlights）／</text>
    <text x="568" y="344" fill="#1c1917">「整個本地 AI 運動的地基」</text>
  </g>

  <text x="60" y="400" font-size="15" font-weight="700" fill="#78350f">分層定位：llamafile 的功勞在分發層，不在推理層</text>
  <g font-size="13">
    <rect x="60" y="412" width="200" height="52" fill="#1f2937" rx="8"/>
    <text x="160" y="434" text-anchor="middle" font-weight="700" fill="#fbbf24">推理引擎層</text>
    <text x="160" y="452" text-anchor="middle" font-size="12" fill="#fde68a">llama.cpp（Gerganov）</text>
    <rect x="272" y="412" width="200" height="52" fill="#f59e0b" rx="8"/>
    <text x="372" y="434" text-anchor="middle" font-weight="700" fill="#451a03">打包分發層 ★</text>
    <text x="372" y="452" text-anchor="middle" font-size="12" fill="#451a03">Cosmopolitan＋APE</text>
    <rect x="484" y="412" width="296" height="52" fill="#ffffff" stroke="#059669" stroke-width="2" rx="8"/>
    <text x="632" y="434" text-anchor="middle" font-weight="700" fill="#065f46">成品：單檔可執行 LLM</text>
    <text x="632" y="452" text-anchor="middle" font-size="12" fill="#047857">llamafile／whisperfile（Mozilla）</text>
    <text x="268" y="444" font-size="16" fill="#78350f">＋</text>
    <text x="490" y="444" font-size="16" fill="#78350f">＝</text>
  </g>
  <text x="60" y="498" font-size="12" fill="#78716c">依據：Mozilla Hacks 2023-11-29（Based on llama.cpp／whisper.cpp 自列）、Mozilla.ai 文件、GitHub API（jart/cosmopolitan 21,341★ ISC；建於 2020-06-15）；星數以 `python3 -c` 驗算漂移 ＋2.1%～＋5.3%。</text>
  <text x="60" y="516" font-size="12" fill="#78716c">單一 X 貼文＋官方自述為主，evidence 取「中」；1998／BBS／SRE 等細節標示未支撐處。</text>
</svg>