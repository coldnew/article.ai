<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <defs>
    <linearGradient id="bytebg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="860" height="520" fill="#fffbeb" rx="12"/>
  <text x="430" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#78350f">APE：同一份位元組，四種身分</text>
  <text x="430" y="60" text-anchor="middle" font-size="13" fill="#92400e">Actually Portable Executable — PE＋ELF＋Mach-O＋Shell Script polyglot（Cosmo 3.0 再加 ZIP＋雙架構胖二進位）</text>

  <!-- the single byte stream -->
  <rect x="40" y="90" width="780" height="86" fill="url(#bytebg)" stroke="#b45309" stroke-width="2" rx="8"/>
  <text x="430" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">同一份位元組（同一個 .com 檔）</text>
  <g font-family="ui-monospace, monospace" font-size="13" font-weight="700">
    <rect x="60" y="122" width="120" height="36" fill="#1f2937" rx="4"/><text x="120" y="146" text-anchor="middle" fill="#fbbf24">MZ … PE</text>
    <rect x="196" y="122" width="130" height="36" fill="#065f46" rx="4"/><text x="261" y="146" text-anchor="middle" fill="#a7f3d0">ELF 檔頭</text>
    <rect x="342" y="122" width="140" height="36" fill="#1e3a8a" rx="4"/><text x="412" y="146" text-anchor="middle" fill="#bfdbfe">Mach-O</text>
    <rect x="498" y="122" width="150" height="36" fill="#7c2d12" rx="4"/><text x="573" y="146" text-anchor="middle" fill="#fed7aa">#!/bin/sh</text>
    <rect x="664" y="122" width="136" height="36" fill="#581c87" rx="4"/><text x="732" y="146" text-anchor="middle" fill="#e9d5ff">PKZIP 目錄</text>
  </g>

  <!-- arrows to four OS loaders -->
  <g font-size="13">
    <line x1="120" y1="176" x2="120" y2="216" stroke="#b45309" stroke-width="2"/>
    <line x1="261" y1="176" x2="261" y2="216" stroke="#b45309" stroke-width="2"/>
    <line x1="412" y1="176" x2="530" y2="216" stroke="#b45309" stroke-width="2"/>
    <line x1="600" y1="176" x2="700" y2="216" stroke="#b45309" stroke-width="2"/>
  </g>
  <g font-size="14">
    <rect x="40" y="216" width="160" height="72" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5" rx="8"/>
    <text x="120" y="242" text-anchor="middle" font-weight="700" fill="#1e3a8a">Windows</text>
    <text x="120" y="262" text-anchor="middle" font-size="12" fill="#1e40af">讀到 PE 就執行</text>
    <text x="120" y="278" text-anchor="middle" font-size="12" fill="#1e40af">其餘位元組當資料</text>

    <rect x="215" y="216" width="160" height="72" fill="#d1fae5" stroke="#065f46" stroke-width="1.5" rx="8"/>
    <text x="295" y="242" text-anchor="middle" font-weight="700" fill="#065f46">Linux / BSD</text>
    <text x="295" y="262" text-anchor="middle" font-size="12" fill="#047857">讀到 ELF 就執行</text>
    <text x="295" y="278" text-anchor="middle" font-size="12" fill="#047857">其餘位元組當資料</text>

    <rect x="450" y="216" width="160" height="72" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5" rx="8"/>
    <text x="530" y="242" text-anchor="middle" font-weight="700" fill="#312e81">macOS</text>
    <text x="530" y="262" text-anchor="middle" font-size="12" fill="#4338ca">Mach-O＋APE loader</text>
    <text x="530" y="278" text-anchor="middle" font-size="12" fill="#4338ca">動態接 libSystem</text>

    <rect x="625" y="216" width="195" height="72" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5" rx="8"/>
    <text x="722" y="242" text-anchor="middle" font-weight="700" fill="#7c2d12">任意 Unix shell</text>
    <text x="722" y="262" text-anchor="middle" font-size="12" fill="#9a3412">`#!/bin/sh` 直接跑</text>
    <text x="722" y="278" text-anchor="middle" font-size="12" fill="#9a3412">二進位藏在註解裡</text>
  </g>

  <!-- bottom: key trick boxes -->
  <text x="40" y="322" font-size="15" font-weight="700" fill="#78350f">關鍵手法（justine.lol 原文說法）</text>
  <g font-size="13" fill="#44403c">
    <rect x="40" y="334" width="240" height="66" fill="#ffffff" stroke="#d6d3d1" rx="8"/>
    <text x="52" y="358" font-weight="700" fill="#1c1917">1．檔頭魔術重疊</text>
    <text x="52" y="378" font-size="12">MZ 同時是 shell 指令，</text>
    <text x="52" y="394" font-size="12">ELF 魔術藏在 PE 允許區</text>
    <rect x="292" y="334" width="252" height="66" fill="#ffffff" stroke="#d6d3d1" rx="8"/>
    <text x="304" y="358" font-weight="700" fill="#1c1917">2．apelink 編排版面</text>
    <text x="304" y="378" font-size="12">Windows 專用碼放遠端區段，</text>
    <text x="304" y="394" font-size="12">MMU 按需分頁，不浪費記憶體</text>
    <rect x="556" y="334" width="264" height="66" fill="#ffffff" stroke="#d6d3d1" rx="8"/>
    <text x="568" y="358" font-weight="700" fill="#1c1917">3．ZIP 內嵌依賴</text>
    <text x="568" y="378" font-size="12">PKZIP 中央目錄帶 /usr/share，</text>
    <text x="568" y="394" font-size="12">llamafile 連模型權重一起包</text>
  </g>
  <text x="40" y="428" font-size="13" font-weight="700" fill="#78350f">Cosmo 3.0 支援矩陣：</text>
  <g font-size="12" fill="#44403c">
    <rect x="40" y="438" width="380" height="60" fill="#fef3c7" stroke="#b45309" rx="8"/>
    <text x="52" y="460" font-weight="700">AMD64：Linux・macOS・Windows・FreeBSD・OpenBSD 7.3・NetBSD</text>
    <text x="52" y="480">ARM64：Linux・macOS・FreeBSD・Windows（非原生）</text>
    <rect x="432" y="438" width="388" height="60" fill="#fef2f2" stroke="#b91c1c" rx="8"/>
    <text x="444" y="460" font-weight="700" fill="#991b1b">llamafile 在 Windows 的上限</text>
    <text x="444" y="480" fill="#7f1d1d">超過 4GB 的執行檔跑不上 Windows（官方文件自承）</text>
  </g>
</svg>