<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <rect x="0" y="0" width="1200" height="560" rx="16" fill="#fafaf9"/>
  <text x="60" y="56" font-size="26" font-weight="700" fill="#1c1917">兩條迴圈：同樣按 Enter，差別在誰決定方向</text>
  <text x="60" y="84" font-size="15" fill="#78716c">整理自《You're Already a Meat Proxy》全文論證；本站自繪</text>

  <!-- Lane 1: meat proxy -->
  <rect x="40" y="110" width="1120" height="190" rx="12" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="64" y="146" font-size="17" font-weight="700" fill="#be123c">迴圈 A｜肉身代理（meat proxy）</text>
  <text x="64" y="170" font-size="13.5" fill="#9f1239">別人決定做什麼 → 你轉成票與程式碼 → 按 Enter → 無人驗證重要性</text>
  <g font-size="14.5" fill="#1c1917">
    <rect x="64" y="188" width="200" height="76" rx="10" fill="#ffffff" stroke="#fda4af"/>
    <text x="164" y="218" text-anchor="middle">接收指令</text>
    <text x="164" y="240" text-anchor="middle" font-size="12.5" fill="#78716c">老闆 / 流程 / Jira</text>
    <text x="278" y="232" font-size="20" fill="#fb7185">→</text>
    <rect x="296" y="188" width="200" height="76" rx="10" fill="#ffffff" stroke="#fda4af"/>
    <text x="396" y="218" text-anchor="middle">轉成產出</text>
    <text x="396" y="240" text-anchor="middle" font-size="12.5" fill="#78716c">讓 Claude 寫票、寫碼</text>
    <text x="510" y="232" font-size="20" fill="#fb7185">→</text>
    <rect x="528" y="188" width="200" height="76" rx="10" fill="#ffffff" stroke="#fda4af"/>
    <text x="628" y="218" text-anchor="middle">按 Enter 出貨</text>
    <text x="628" y="240" text-anchor="middle" font-size="12.5" fill="#78716c">12–13 小時 / 天</text>
    <text x="742" y="232" font-size="20" fill="#fb7185">→</text>
    <rect x="760" y="188" width="200" height="76" rx="10" fill="#ffffff" stroke="#fda4af"/>
    <text x="860" y="218" text-anchor="middle">無人思考</text>
    <text x="860" y="240" text-anchor="middle" font-size="12.5" fill="#78716c">「沒有勝利感」</text>
    <text x="974" y="232" font-size="20" fill="#fb7185">↺</text>
    <rect x="992" y="188" width="144" height="76" rx="10" fill="#be123c"/>
    <text x="1064" y="218" text-anchor="middle" fill="#ffffff" font-weight="700">慣性續命</text>
    <text x="1064" y="240" text-anchor="middle" font-size="12.5" fill="#fecdd3">跑道燒完為止</text>
  </g>

  <!-- Lane 2: judgment -->
  <rect x="40" y="320" width="1120" height="190" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="64" y="356" font-size="17" font-weight="700" fill="#047857">迴圈 B｜行使判斷力（作者開的藥方）</text>
  <text x="64" y="380" font-size="13.5" fill="#065f46">你決定做什麼 → 機器做大部分工 → 你驗證「重要性」→ 交付給真人</text>
  <g font-size="14.5" fill="#1c1917">
    <rect x="64" y="398" width="200" height="76" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="164" y="428" text-anchor="middle">決定做什麼</text>
    <text x="164" y="450" text-anchor="middle" font-size="12.5" fill="#78716c">找真問題、談判共識</text>
    <text x="278" y="442" font-size="20" fill="#34d399">→</text>
    <rect x="296" y="398" width="200" height="76" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="396" y="428" text-anchor="middle">機器執行</text>
    <text x="396" y="450" text-anchor="middle" font-size="12.5" fill="#78716c">Fable 等代理做 75–80%</text>
    <text x="510" y="442" font-size="20" fill="#34d399">→</text>
    <rect x="528" y="398" width="200" height="76" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="628" y="428" text-anchor="middle">驗證重要性</text>
    <text x="628" y="450" text-anchor="middle" font-size="12.5" fill="#78716c">有人注意到差異嗎？</text>
    <text x="742" y="442" font-size="20" fill="#34d399">→</text>
    <rect x="760" y="398" width="200" height="76" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="860" y="428" text-anchor="middle">小而重要</text>
    <text x="860" y="450" text-anchor="middle" font-size="12.5" fill="#78716c">本週做完一件</text>
    <text x="974" y="442" font-size="20" fill="#34d399">↺</text>
    <rect x="992" y="398" width="144" height="76" rx="10" fill="#047857"/>
    <text x="1064" y="428" text-anchor="middle" fill="#ffffff" font-weight="700">累積籌碼</text>
    <text x="1064" y="450" text-anchor="middle" font-size="12.5" fill="#a7f3d0">判斷力複利</text>
  </g>

  <text x="60" y="540" font-size="13" fill="#78716c">作者原句：You don't become less of a meat proxy by personally typing more of the code.（多打字不會讓你比較不像代理）</text>
</svg>
