<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="EvoClaw 連續演化性能懸崖長條圖">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
    <style>
      .title { font: 700 32px "Noto Sans TC", "PingFang TC", sans-serif; fill: #0f172a; }
      .sub { font: 500 18px "Noto Sans TC", "PingFang TC", sans-serif; fill: #334155; }
      .pct { font: 700 44px "SFMono-Regular", Consolas, Menlo, monospace; fill: #0f172a; }
      .barlabel { font: 700 20px "Noto Sans TC", "PingFang TC", sans-serif; fill: #0f172a; }
      .barsub { font: 500 16px "Noto Sans TC", "PingFang TC", sans-serif; fill: #475569; }
      .note { font: 600 18px "Noto Sans TC", "PingFang TC", sans-serif; fill: #1e293b; }
      .drop { font: 700 22px "SFMono-Regular", Consolas, Menlo, monospace; fill: #b91c1c; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="520" fill="url(#bg2)"/>

  <text x="60" y="62" class="title">EvoClaw：從孤立任務到連續演化，掉了一半以上</text>
  <text x="60" y="96" class="sub">12 個前沿模型 × 4 種 Agent 框架；連續演化要求跨 commit 維持系統完整，錯誤會累積。</text>

  <text x="200" y="170" class="pct">82%</text>
  <text x="760" y="170" class="pct">38%</text>

  <rect x="120" y="190" width="260" height="180" rx="14" fill="#2563eb"/>
  <rect x="680" y="290" width="260" height="80" rx="14" fill="#ef4444"/>

  <line x1="0" y1="370" x2="1200" y2="370" stroke="#cbd5e1" stroke-width="2"/>

  <text x="140" y="412" class="barlabel">孤立任務</text>
  <text x="140" y="438" class="barsub">單一 issue 修復，有完整上下文</text>

  <text x="690" y="412" class="barlabel">連續演化</text>
  <text x="690" y="438" class="barsub">跨 commit 持續開發，錯誤級聯</text>

  <line x1="400" y1="230" x2="660" y2="300" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="430" y="260" class="drop">−54% 懸崖</text>

  <rect x="60" y="462" width="1080" height="38" rx="12" fill="#fee2e2"/>
  <text x="84" y="487" class="note">判讀：增強範式今天已可用；全自主軟體工程仍差一個記憶體 + 驗證架構。數據依原文 §5 重繪。</text>
</svg>
