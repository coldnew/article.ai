<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="傳統軟體與 Agent 系統的範式對照圖">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <style>
      .title { font: 700 32px "Noto Sans TC", "PingFang TC", sans-serif; fill: #0f172a; }
      .sub { font: 500 18px "Noto Sans TC", "PingFang TC", sans-serif; fill: #334155; }
      .label { font: 700 22px "Noto Sans TC", "PingFang TC", sans-serif; fill: #0f172a; }
      .mono { font: 600 19px "SFMono-Regular", Consolas, Menlo, monospace; fill: #111827; }
      .small { font: 500 16px "Noto Sans TC", "PingFang TC", sans-serif; fill: #475569; }
      .chip { font: 700 14px "Noto Sans TC", "PingFang TC", sans-serif; fill: #1d4ed8; }
      .chip2 { font: 700 14px "Noto Sans TC", "PingFang TC", sans-serif; fill: #047857; }
      .note { font: 600 18px "Noto Sans TC", "PingFang TC", sans-serif; fill: #1e293b; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#ah); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="url(#bg)"/>

  <text x="60" y="62" class="title">程式碼從「系統本身」降級為「拋棄式工具」</text>
  <text x="60" y="96" class="sub">左：傳統軟體 S=(C,D,E)，決策邏輯 D 執行前寫死；右：Agent A=(M,T,M,Π)，程式碼用完即丟。</text>

  <rect x="60" y="130" width="520" height="330" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="620" y="130" width="520" height="330" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="88" y="156" width="150" height="32" rx="16" fill="#dbeafe"/>
  <text x="112" y="178" class="chip">傳統 SE</text>
  <text x="88" y="220" class="label">AI → 軟體 → 結果</text>

  <text x="88" y="264" class="mono">人類寫死 D</text>
  <text x="88" y="296" class="small">人類理解變更 → 定位 D → 修改</text>
  <text x="88" y="322" class="small">→ 驗證不回歸 → 部署</text>
  <text x="88" y="364" class="mono">複雜度 P(n) ∈ Θ(2ⁿ)</text>
  <text x="88" y="396" class="small">人類認知 C_H 恆定，註定撞牆</text>
  <rect x="88" y="414" width="460" height="30" rx="8" fill="#fef2f2"/>
  <text x="100" y="435" class="small">瓶頸仍在人類：設計 / 整合 / 測試</text>

  <rect x="648" y="156" width="170" height="32" rx="16" fill="#d1fae5"/>
  <text x="672" y="178" class="chip2">AGENTIC (AaaS)</text>
  <text x="648" y="220" class="label">Agent → 結果</text>

  <text x="648" y="264" class="mono">a_t ← M(s_t, ℳ)</text>
  <text x="648" y="296" class="small">意圖 → Π 分解 → 臨時程式碼</text>
  <text x="648" y="322" class="small">→ 工具執行 → 驗證 → 交付</text>
  <text x="648" y="364" class="mono">容量 C_M 隨算力成長</text>
  <text x="648" y="396" class="small">失敗自修；成功沉澱為 Skill</text>
  <rect x="648" y="414" width="460" height="30" rx="8" fill="#ecfdf5"/>
  <text x="660" y="435" class="small">人類轉為：意圖架構師 / 協調者 / 審計者</text>

  <rect x="60" y="486" width="1080" height="38" rx="12" fill="#e0e7ff"/>
  <text x="84" y="511" class="note">結論：AaaS 省掉的不是寫碼，而是「靜態軟體成品」這個中間物；留下的能力是 Agent 本身。</text>
</svg>
