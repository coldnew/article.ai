<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="12" fill="#f8fafc"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">雙用途試驗：在治 IPF 的試驗裡，順便測抗老</text>

  <!-- left: trial -->
  <rect x="20" y="50" width="220" height="300" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="76" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Phase 2a（原試驗）</text>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <rect x="36" y="90" width="188" height="40" rx="8" fill="#dbeafe"/>
    <text x="130" y="107">IPF 患者 71 人收案</text>
    <text x="130" y="123">中國 21 中心，2023–24</text>
    <rect x="36" y="140" width="188" height="56" rx="8" fill="#dbeafe"/>
    <text x="130" y="157">30mg QD／30mg BID／</text>
    <text x="130" y="173">60mg QD／安慰劑</text>
    <text x="130" y="189">共 12 週</text>
    <rect x="36" y="206" width="188" height="40" rx="8" fill="#dbeafe"/>
    <text x="130" y="223">主要終點：FVC</text>
    <text x="130" y="239">（用力肺活量）</text>
    <rect x="36" y="256" width="188" height="78" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="130" y="273" font-weight="bold" fill="#92400e">外加的衰老採血</text>
    <text x="130" y="290" fill="#92400e">Olink 3072 蛋白</text>
    <text x="130" y="306" fill="#92400e">第 0／2／4／12 週</text>
    <text x="130" y="322" fill="#92400e">42 人完整四點數據</text>
  </g>

  <!-- middle arrow -->
  <line x1="250" y1="200" x2="290" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arr3)"/>
  <text x="270" y="185" font-size="11" fill="#64748b" text-anchor="middle">血清</text>

  <!-- right: clocks -->
  <rect x="300" y="50" width="440" height="300" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="76" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">六個蛋白質衰老時鐘（事後重算）</text>
  <g font-size="12" text-anchor="middle">
    <rect x="316" y="90" width="200" height="52" rx="8" fill="#dcfce7"/>
    <text x="416" y="109" font-weight="bold" fill="#166534">測實際年齡（4 個）</text>
    <text x="416" y="127" fill="#166534">ProtAge・OrganAgechrono 等</text>
    <rect x="524" y="90" width="200" height="52" rx="8" fill="#fee2e2"/>
    <text x="624" y="109" font-weight="bold" fill="#991b1b">測死亡風險（2 個）</text>
    <text x="624" y="127" fill="#991b1b">PAC・OrganAgemortality</text>
  </g>
  <text x="416" y="158" font-size="11" fill="#64748b" text-anchor="middle">ipfP3GPT・PAOPAC（另二測齡鐘）</text>
  <rect x="316" y="170" width="408" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="520" y="192" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">輸出：ΔBioAge（用藥前後生物年齡差）</text>
  <text x="520" y="212" font-size="12" fill="#0f172a" text-anchor="middle">54 組比較（6 鐘 × 3 時點 × 3 劑量）→ 21 組顯著</text>
  <text x="520" y="232" font-size="12" fill="#0f172a" text-anchor="middle">＋ UK Biobank 55,319 人對照＋ GSEA 衰老通路＋ PPI</text>
  <text x="520" y="252" font-size="12" fill="#0f172a" text-anchor="middle">（時鐘解不開「抗老 vs 病好」的糾纏，靠旁證間接論證）</text>
  <rect x="316" y="270" width="408" height="64" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="520" y="292" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">目標：以後治老化相關疾病的試驗，常規附帶衰老終點</text>
  <text x="520" y="312" font-size="12" fill="#166534" text-anchor="middle">一種藥、兩種評估：療效 ＋ 衰老調節</text>

  <text x="380" y="378" font-size="12" fill="#64748b" text-anchor="middle">rentosertib（INS018_055）：AI 設計的 TNIK 抑制劑，同時押抗纖維化與抗老兩個適應症方向</text>
</svg>
