<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="760" height="400" rx="12" fill="#f8fafc"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">六個鐘一致向下，但兩類鐘說的是不同故事</text>

  <!-- left: chrono clocks -->
  <rect x="20" y="50" width="350" height="220" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="195" y="76" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">測實際年齡的鐘（4 個）</text>
  <text x="195" y="96" font-size="12" fill="#475569" text-anchor="middle">基線 r = 0.70–0.84，RMSE 不到 4 年</text>
  <g font-size="12" text-anchor="middle">
    <rect x="36" y="108" width="318" height="44" rx="8" fill="#dbeafe"/>
    <text x="195" y="126" font-weight="bold" fill="#1e40af">60mg QD：第 4 週 Δ −2.71～−3.46 年</text>
    <text x="195" y="143" fill="#1e40af">四個鐘全顯著（Q 小於 0.10）</text>
    <rect x="36" y="160" width="318" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="195" y="178" font-weight="bold" fill="#0f172a">30mg BID：跨五個鐘一致向下</text>
    <text x="195" y="195" fill="#475569" fill-opacity="1">每日總量同 60mg，分兩次吃更穩？</text>
    <rect x="36" y="212" width="318" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="195" y="230" font-weight="bold" fill="#0f172a">第 12 週：訊號衰減 → 高原</text>
    <text x="195" y="247" fill="#475569" fill-opacity="1">蛋白仍在動，鐘卻不動了（LTBP2 主導？）</text>
  </g>

  <!-- right: mortality clocks -->
  <rect x="390" y="50" width="350" height="220" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="565" y="76" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">測死亡風險的鐘（2 個）</text>
  <text x="565" y="96" font-size="12" fill="#475569" text-anchor="middle">基線 r 僅 0.16–0.23（重病隊列，符合預期）</text>
  <g font-size="12" text-anchor="middle">
    <rect x="406" y="108" width="318" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="565" y="126" font-weight="bold" fill="#0f172a">60mg QD：兩個鐘全不顯著</text>
    <text x="565" y="143" fill="#475569" fill-opacity="1">只動年齡鐘，不動死亡鐘</text>
    <rect x="406" y="160" width="318" height="44" rx="8" fill="#fee2e2"/>
    <text x="565" y="178" font-weight="bold" fill="#991b1b">30mg BID：兩類鐘都抓到訊號</text>
    <text x="565" y="195" fill="#991b1b">跨鐘一致性最廣（9 組顯著）</text>
    <rect x="406" y="212" width="318" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="565" y="230" font-weight="bold" fill="#0f172a">器官鐘彩蛋：動脈鐘全時點顯著</text>
    <text x="565" y="247" fill="#475569" fill-opacity="1">Δ −6.95～−16.57 年（探索性，解讀留白）</text>
  </g>

  <!-- bottom: dissociation -->
  <rect x="20" y="284" width="720" height="96" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="380" y="308" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">脫鉤論證：肺功能改善最多 ≠ 變年輕最多</text>
  <text x="380" y="330" font-size="12" fill="#92400e" text-anchor="middle">60mg QD 的 FVC 進步最大，但衰老訊號不如 30mg BID；ΔFVC 只能解釋 ΔBioAge 極小變異（中位 R² = 0.06）</text>
  <text x="380" y="350" font-size="12" fill="#92400e" text-anchor="middle">30mg BID 蛋白變化與正常老化方向負相關（r = −0.30），60mg QD 無此相關 —— 間接證據，不是因果證明</text>
  <text x="380" y="368" font-size="11" fill="#a16207" text-anchor="middle">作者自承：徹底解開糾纏需在健康人身上驗證；纖維化蛋白（LTBP2）是六鐘共同的最大貢獻者</text>
</svg>
