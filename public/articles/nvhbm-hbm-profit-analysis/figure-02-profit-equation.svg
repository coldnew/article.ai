<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="760" height="360" rx="12" fill="#f8fafc"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">一家記憶體廠的 HBM 毛利 ＝ 行業出貨 × 廠商份額 × 每疊毛利</text>

  <!-- equation boxes -->
  <rect x="60" y="50" width="180" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="74" font-size="13" fill="#1e40af" text-anchor="middle">行業出貨量</text>
  <text x="150" y="98" font-size="15" font-weight="bold" fill="#1e40af" text-anchor="middle">5,000萬 → 6,500萬疊</text>

  <text x="258" y="92" font-size="22" fill="#64748b" text-anchor="middle">×</text>

  <rect x="276" y="50" width="180" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="366" y="74" font-size="13" fill="#5b21b6" text-anchor="middle">廠商數量份額</text>
  <text x="366" y="98" font-size="13" font-weight="bold" fill="#5b21b6" text-anchor="middle">A/B/C 重新洗牌</text>

  <text x="474" y="92" font-size="22" fill="#64748b" text-anchor="middle">×</text>

  <rect x="492" y="50" width="208" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="596" y="74" font-size="13" fill="#92400e" text-anchor="middle">每疊毛利</text>
  <text x="596" y="98" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">$400 → $360（−10%）</text>

  <!-- teaching table -->
  <text x="60" y="150" font-size="13" font-weight="bold" fill="#0f172a">教學假設（作者明示：數字不對應任何真實公司）</text>
  <rect x="60" y="160" width="640" height="118" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="60" y1="196" x2="700" y2="196" stroke="#e2e8f0"/>
  <line x1="60" y1="232" x2="700" y2="232" stroke="#e2e8f0"/>
  <line x1="280" y1="160" x2="280" y2="278" stroke="#e2e8f0"/>
  <line x1="480" y1="160" x2="480" y2="278" stroke="#e2e8f0"/>
  <text x="170" y="184" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">A（55% → 47%）</text>
  <text x="380" y="184" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">B（25% → 30%）</text>
  <text x="590" y="184" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">C（20% → 23%）</text>
  <text x="170" y="220" font-size="12" fill="#475569" text-anchor="middle">2,750萬 → 3,055萬疊</text>
  <text x="380" y="220" font-size="12" fill="#475569" text-anchor="middle">1,250萬 → 1,950萬疊</text>
  <text x="590" y="220" font-size="12" fill="#475569" text-anchor="middle">1,000萬 → 1,495萬疊</text>
  <text x="170" y="256" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">毛利 $110億 → $110億</text>
  <text x="380" y="256" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">毛利 $50億 → $70億</text>
  <text x="590" y="256" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">毛利 $40億 → $54億</text>

  <!-- takeaway -->
  <rect x="60" y="292" width="640" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="380" y="313" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">結論：行業多賣三成，A 公司毛利幾乎沒多賺——熱鬧 ≠ 每家都受益</text>
  <text x="380" y="332" font-size="11" fill="#991b1b" text-anchor="middle">現實參照（Counterpoint Q2 收入份額，非疊數）：海力士 50%・三星 33%・美光 18%，且早於 NVHBM 公布</text>
</svg>
