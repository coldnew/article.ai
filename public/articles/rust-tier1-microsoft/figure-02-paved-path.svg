<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="800" height="400" fill="#faf9f5"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#141413">Tier-1 的真正含義：內部鋪好的路（paved path）</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="60" width="160" height="70" rx="8" fill="#fff" stroke="#1b365d" stroke-width="2"/>
    <text x="110" y="86" font-weight="700" fill="#1b365d">本地開發</text>
    <text x="110" y="107" font-size="12" fill="#6b6a64">生產力工具鏈</text>
    <text x="270" y="102" font-size="18" fill="#1b365d">→</text>
    <rect x="300" y="60" width="160" height="70" rx="8" fill="#fff" stroke="#1b365d" stroke-width="2"/>
    <text x="380" y="86" font-weight="700" fill="#1b365d">安全供應鏈</text>
    <text x="380" y="107" font-size="12" fill="#6b6a64">rustc・stdlib 自建</text>
    <text x="540" y="102" font-size="18" fill="#1b365d">→</text>
    <rect x="570" y="60" width="200" height="70" rx="8" fill="#fff" stroke="#1b365d" stroke-width="2"/>
    <text x="670" y="86" font-weight="700" fill="#1b365d">生產管線＋合規</text>
    <text x="670" y="107" font-size="12" fill="#6b6a64">品質流程・SDL 要求</text>
  </g>
  <line x1="400" y1="130" x2="400" y2="152" stroke="#8a5a2b" stroke-width="2"/>
  <rect x="180" y="152" width="440" height="76" rx="8" fill="#fff7ec" stroke="#8a5a2b" stroke-width="2"/>
  <text x="400" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#8a5a2b">與 C++・C#・TypeScript 同列最佳支援</text>
  <text x="400" y="200" text-anchor="middle" font-size="12" fill="#6b6a64">100+ 內部 repo 已用 codegen_utc 建置，每週增加中</text>
  <text x="400" y="216" text-anchor="middle" font-size="12" fill="#6b6a64">Rust 1.90 起自我託管（self-hosted）</text>
  <line x1="150" y1="228" x2="150" y2="248" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="650" y1="228" x2="650" y2="248" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="60" y="248" width="680" height="104" rx="8" fill="#fff" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="400" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#6b6a64">Tier-1 ≠ 的三件事（HN 糾正串）</text>
  <text x="400" y="296" text-anchor="middle" font-size="12" fill="#6b6a64">① 不是 rustc 的 target tier 分級　② 不等於 VS 開箱支援 Rust　③ 沒有公開的 Tier-2 / Tier-3 名單</text>
  <text x="400" y="318" text-anchor="middle" font-size="12" fill="#6b6a64">效力範圍只在微軟內部工程系統，不是對全社群的承諾</text>
  <text x="400" y="368" text-anchor="middle" font-size="11" fill="#6b6a64">本站自繪示意圖，據客座原文＋ HN 留言 gshubert17／swiftcoder／phire 整理</text>
</svg>
