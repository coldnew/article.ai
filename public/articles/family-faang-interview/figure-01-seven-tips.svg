<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="760" height="400" rx="12" fill="#f8fafc"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">有家庭備戰 FAANG：七條的三層結構</text>

  <!-- layer 1 -->
  <rect x="40" y="48" width="680" height="86" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="72" font-size="13" font-weight="bold" fill="#166534">第零層・先活著</text>
  <circle cx="74" cy="102" r="13" fill="#16a34a"/>
  <text x="74" y="107" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="96" y="98" font-size="13" font-weight="bold" fill="#0f172a">先穩住現金流</text>
  <text x="96" y="118" font-size="12" fill="#475569">帳單沒著落硬衝 FAANG＝把家庭當槓桿；先拿養活人的工作，再按自己節奏刷題</text>

  <!-- layer 2 -->
  <rect x="40" y="146" width="680" height="158" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="170" font-size="13" font-weight="bold" fill="#1e40af">第二層・怎麼練（輸出導向）</text>
  <circle cx="74" cy="196" r="13" fill="#2563eb"/>
  <text x="74" y="201" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="96" y="192" font-size="13" font-weight="bold" fill="#0f172a">量不是勝負手，模式才是</text>
  <text x="96" y="211" font-size="12" fill="#475569">Blind 75／NeetCode 75，每天 1–2 道＋錯題復盤；學習發生在「同類題第二次為何還錯」</text>
  <circle cx="74" cy="236" r="13" fill="#2563eb"/>
  <text x="74" y="241" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="96" y="232" font-size="13" font-weight="bold" fill="#0f172a">時間只能偷，不能等</text>
  <text x="96" y="251" font-size="12" fill="#475569">家人未醒的 60 分鐘最乾淨；通勤洗碗抱小孩時在腦中走解法＋複雜度</text>
  <circle cx="430" cy="196" r="13" fill="#2563eb"/>
  <text x="430" y="201" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="452" y="192" font-size="13" font-weight="bold" fill="#0f172a">模擬比刷題更能換錢</text>
  <text x="452" y="211" font-size="12" fill="#475569">一週一次 mock；壓力下講清楚比安靜寫最優解更接近面試</text>
  <circle cx="430" cy="236" r="13" fill="#2563eb"/>
  <text x="430" y="241" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="452" y="232" font-size="13" font-weight="bold" fill="#0f172a">級別越高，LC 權重越低</text>
  <text x="452" y="251" font-size="12" fill="#475569">中高級吃系統設計＋敘事＋判斷力；別用應屆生題量懲罰自己</text>

  <!-- layer 3 -->
  <rect x="40" y="316" width="680" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="338" font-size="13" font-weight="bold" fill="#92400e">第三層・怎麼不散（關係與續航）</text>
  <circle cx="74" cy="360" r="13" fill="#d97706"/>
  <text x="74" y="365" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="96" y="356" font-size="12" fill="#0f172a"><tspan font-weight="bold">配偶對齊</tspan>：缺席事先談好誰帶娃誰加班，沒談妥效率指數下降</text>
  <circle cx="430" cy="360" r="13" fill="#d97706"/>
  <text x="430" y="365" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="452" y="356" font-size="12" fill="#0f172a"><tspan font-weight="bold">家庭時間是燃料</tspan>：每天 30 分鐘無壓力陪孩子；燃盡過不了 onsite</text>
</svg>
