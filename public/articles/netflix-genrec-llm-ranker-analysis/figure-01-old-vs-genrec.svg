<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="360" rx="12" fill="#f8fafc"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">舊棧 vs GenRec：特徵工程 → 脈絡工程，專屬架構 → 共享基座</text>

  <!-- old -->
  <rect x="20" y="50" width="340" height="230" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="190" y="74" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">舊生產棧（多年打磨）</text>
  <rect x="40" y="90" width="300" height="36" rx="6" fill="#fee2e2"/>
  <text x="190" y="105" font-size="11" fill="#991b1b" text-anchor="middle">行為 → 數千手工特徵＋高階交互</text>
  <text x="190" y="121" font-size="11" fill="#991b1b" text-anchor="middle">聚合管線＋新鮮度＋防洩漏全套基建</text>
  <rect x="40" y="134" width="300" height="36" rx="6" fill="#fee2e2"/>
  <text x="190" y="149" font-size="11" fill="#991b1b" text-anchor="middle">專屬架構：交互網路／動態興趣／多任務</text>
  <text x="190" y="165" font-size="11" fill="#991b1b" text-anchor="middle">新內容型別上線＝重做一輪管線</text>
  <rect x="40" y="178" width="300" height="36" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="190" y="193" font-size="11" fill="#334155" text-anchor="middle">判別式排序器，海量 Phase-2 標註餵養</text>
  <text x="190" y="209" font-size="11" fill="#334155" text-anchor="middle">複雜，但跟了業務十多年</text>
  <text x="190" y="252" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">prompt 即新特徵向量</text>

  <!-- new -->
  <rect x="400" y="50" width="340" height="230" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="570" y="74" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">GenRec（兩階段 LLM 棧）</text>
  <rect x="420" y="90" width="300" height="36" rx="6" fill="#dcfce7"/>
  <text x="570" y="105" font-size="11" fill="#166534" text-anchor="middle">Phase 1：開源 LLM＋網飛語料打底（低頻）</text>
  <text x="570" y="121" font-size="11" fill="#166534" text-anchor="middle">Phase 2：排序數據＋獎勵高頻 post-train</text>
  <rect x="420" y="134" width="300" height="36" rx="6" fill="#dcfce7"/>
  <text x="570" y="149" font-size="11" fill="#166534" text-anchor="middle">行為＋元數據口語化→ 單次 prefill 前向</text>
  <text x="570" y="165" font-size="11" fill="#166534" text-anchor="middle">目錄感知評分頭，全目錄一次打分</text>
  <rect x="420" y="178" width="300" height="36" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="570" y="193" font-size="11" fill="#334155" text-anchor="middle">新場景用 prompt 轉向，不重搭模型</text>
  <text x="570" y="209" font-size="11" fill="#334155" text-anchor="middle">5000→1700 token，服務成本約剩三分之一</text>
  <text x="570" y="252" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">比的是 Phase-2 邊際數據效率</text>

  <rect x="20" y="296" width="720" height="44" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
  <text x="380" y="323" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">貼文沒說的前半句：Phase 1 基座訓練本身很重，40 倍只是後半段的帳</text>
</svg>
