<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="720" height="340" fill="#faf9f5"/>
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#141413">套利判斷鏈：四站＋真正的陷阱</text>

  <rect x="24" y="60" width="140" height="64" rx="8" fill="#fff" stroke="#1b365d" stroke-width="1.5"/>
  <text x="94" y="86" font-size="13" font-weight="bold" fill="#1b365d" text-anchor="middle">Market Data</text>
  <text x="94" y="106" font-size="12" fill="#6b6a64" text-anchor="middle">Listener 收行情</text>

  <rect x="196" y="60" width="140" height="64" rx="8" fill="#fff" stroke="#1b365d" stroke-width="1.5"/>
  <text x="266" y="86" font-size="13" font-weight="bold" fill="#1b365d" text-anchor="middle">Order Book</text>
  <text x="266" y="106" font-size="12" fill="#6b6a64" text-anchor="middle">Manager 維護盤口</text>

  <rect x="368" y="60" width="140" height="64" rx="8" fill="#fff" stroke="#1b365d" stroke-width="1.5"/>
  <text x="438" y="86" font-size="13" font-weight="bold" fill="#1b365d" text-anchor="middle">Arbitrage Engine</text>
  <text x="438" y="106" font-size="12" fill="#6b6a64" text-anchor="middle">max(Bid) &gt; min(Ask)?</text>

  <rect x="540" y="60" width="140" height="64" rx="8" fill="#fff" stroke="#1b365d" stroke-width="1.5"/>
  <text x="610" y="86" font-size="13" font-weight="bold" fill="#1b365d" text-anchor="middle">Execution Router</text>
  <text x="610" y="106" font-size="12" fill="#6b6a64" text-anchor="middle">下兩條腿訂單</text>

  <text x="174" y="98" font-size="16" fill="#1b365d">→</text>
  <text x="346" y="98" font-size="16" fill="#1b365d">→</text>
  <text x="518" y="98" font-size="16" fill="#1b365d">→</text>

  <text x="24" y="152" font-size="13" fill="#6b6a64">只重算「發生變化的那一個 Instrument」的全交易所最高 Bid / 最低 Ask</text>

  <rect x="24" y="170" width="656" height="140" rx="8" fill="#fff" stroke="#8a5a2b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="196" font-size="14" font-weight="bold" fill="#8a5a2b">真正的陷阱：legging risk（兩條腿非原子提交）</text>

  <rect x="40" y="210" width="180" height="52" rx="6" fill="#f5f4ed" stroke="#8a5a2b"/>
  <text x="130" y="231" font-size="12" font-weight="bold" fill="#141413" text-anchor="middle">腿一：A 賣單送出</text>
  <text x="130" y="249" font-size="11" fill="#6b6a64" text-anchor="middle">價差還在 ✓</text>

  <text x="232" y="242" font-size="14" fill="#8a5a2b">— 網路延遲 →</text>

  <rect x="340" y="210" width="180" height="52" rx="6" fill="#f5f4ed" stroke="#8a5a2b"/>
  <text x="430" y="231" font-size="12" font-weight="bold" fill="#141413" text-anchor="middle">腿二：B 買單抵達</text>
  <text x="430" y="249" font-size="11" fill="#8a5a2b" text-anchor="middle">價差已收窄甚至消失 ✗</text>

  <text x="40" y="288" font-size="12" fill="#141413">對策：安全閾值 margin（覆蓋延遲＋滑點）＋ size 取 min(bid_size, ask_size) ＋ partial fill 後 hedge / cancel 另一腿</text>
</svg>
