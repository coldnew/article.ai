<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="720" height="340" fill="#faf9f5"/>
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#141413">100 萬 updates/sec：把範圍縮到變化的 Instrument</text>

  <rect x="24" y="60" width="200" height="64" rx="8" fill="#fff" stroke="#1b365d" stroke-width="1.5"/>
  <text x="124" y="86" font-size="13" font-weight="bold" fill="#1b365d" text-anchor="middle">ingestion（吃行情）</text>
  <text x="124" y="106" font-size="12" fill="#6b6a64" text-anchor="middle">ring buffer 解耦</text>

  <text x="234" y="98" font-size="16" fill="#1b365d">→</text>

  <rect x="254" y="60" width="200" height="64" rx="8" fill="#fff" stroke="#1b365d" stroke-width="1.5"/>
  <text x="354" y="86" font-size="13" font-weight="bold" fill="#1b365d" text-anchor="middle">一致性哈希分流</text>
  <text x="354" y="106" font-size="12" fill="#6b6a64" text-anchor="middle">按 instrument_id 路由</text>

  <text x="464" y="98" font-size="16" fill="#1b365d">→</text>

  <rect x="494" y="60" width="190" height="64" rx="8" fill="#fff" stroke="#1b365d" stroke-width="1.5"/>
  <text x="589" y="86" font-size="13" font-weight="bold" fill="#1b365d" text-anchor="middle">固定執行緒 / core</text>
  <text x="589" y="106" font-size="12" fill="#6b6a64" text-anchor="middle">天然無鎖＋cache 好</text>

  <rect x="24" y="150" width="660" height="160" rx="8" fill="#fff" stroke="#1b365d" stroke-width="1"/>
  <text x="40" y="176" font-size="14" font-weight="bold" fill="#1b365d">每個 shard 內部的具體機制（面試官想聽的名詞）</text>

  <text x="40" y="202" font-size="12" fill="#141413">• Best Bid / Ask：按 exchange_id 索引的<tspan font-weight="bold">定長陣列</tspan>，更新 O(1)</text>
  <text x="40" y="224" font-size="12" fill="#141413">• JVM 系：避 GC pause（off-heap / primitive array），或 <tspan font-weight="bold">LMAX Disruptor</tspan> 做 ingestion 與計算解耦</text>
  <text x="40" y="246" font-size="12" fill="#141413">• stale quote：Quote 加 <tspan font-weight="bold">TTL</tspan>，交易所斷線不拿舊報價判斷</text>
  <text x="40" y="268" font-size="12" fill="#141413">• 防重複下單狀態機：<tspan font-weight="bold">pending → triggered → filled</tspan></text>
  <text x="40" y="294" font-size="12" fill="#8a5a2b">「減少全域鎖競爭」「避免不必要的記憶體分配」太泛——要講到這種顆粒度才有分量</text>
</svg>
