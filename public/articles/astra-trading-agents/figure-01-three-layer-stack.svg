  <g font-size="13" fill="#141413">
    <rect x="40" y="55" width="150" height="90" rx="8" fill="#fff" stroke="#1b365d" stroke-width="2"/>
    <text x="115" y="80" text-anchor="middle" font-weight="bold">Grok Bot 駕駛艙</text>
    <text x="115" y="100" text-anchor="middle" font-size="12" fill="#6b6a64">8 個具名 bot</text>
    <text x="115" y="118" text-anchor="middle" font-size="12" fill="#6b6a64">自然語言下指令</text>
    <rect x="230" y="55" width="150" height="90" rx="8" fill="#fff" stroke="#1b365d" stroke-width="2"/>
    <text x="305" y="80" text-anchor="middle" font-weight="bold">Kimi K3 Swarm</text>
    <text x="305" y="100" text-anchor="middle" font-size="12" fill="#6b6a64">300 子 agent 掃描</text>
    <text x="305" y="118" text-anchor="middle" font-size="12" fill="#6b6a64">訂單簿／期權流／ filings</text>
    <rect x="420" y="55" width="150" height="90" rx="8" fill="#fff" stroke="#1b365d" stroke-width="2"/>
    <text x="495" y="80" text-anchor="middle" font-weight="bold">GPT-6 Astra</text>
    <text x="495" y="100" text-anchor="middle" font-size="12" fill="#6b6a64">假設→回測→驗證</text>
