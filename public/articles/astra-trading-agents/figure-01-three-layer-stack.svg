    <text x="360" y="299" text-anchor="middle" font-size="12" fill="#6b6a64">作者：每月約 $300–500 ／ 官方：輸入超 272K tokens 整單 2 倍價（$20／$75）—— 24/7 管線幾乎注定走長上下文檔</text>
