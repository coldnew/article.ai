  </g>
  <g font-size="20" fill="#1b365d">
    <text x="200" y="108">→</text>
    <text x="390" y="108">→</text>
  </g>
  <rect x="230" y="170" width="340" height="60" rx="8" fill="#fff" stroke="#8a5a2b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="400" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#141413">Telegram 通知層：品種＋策略＋信心分＋ Sharpe ＋回撤＋ Kelly 倉位</text>
