<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="760" height="400" rx="12" fill="#f8fafc"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">專利 FIG.4 核心結構：共振層＋絕緣層＋屏蔽層，逐層往上長</text>

  <!-- substrate -->
  <rect x="180" y="330" width="400" height="30" rx="4" fill="#94a3b8"/>
  <text x="380" y="350" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">基板 310（藍寶石或 Si，約 400–700 μm）</text>

  <!-- stack Sn (even, mirrored) -->
  <rect x="220" y="70" width="320" height="26" rx="4" fill="#7c3aed"/>
  <text x="380" y="88" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">上部超導層 450（頂層封口）</text>
  <rect x="220" y="100" width="320" height="30" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="380" y="119" font-size="11" fill="#713f12" text-anchor="middle">絕緣層 430（SiO₂ 約 500nm／AlOx 約 250nm）</text>
  <rect x="220" y="134" width="320" height="26" rx="4" fill="#2563eb"/>
  <text x="380" y="152" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">共振層 320（超導波導，約 50–100nm）</text>

  <rect x="220" y="164" width="320" height="30" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="380" y="183" font-size="11" fill="#713f12" text-anchor="middle">絕緣層 430（200–600nm）</text>
  <rect x="260" y="198" width="240" height="26" rx="4" fill="#7c3aed"/>
  <text x="380" y="216" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">超導屏蔽層 440（偶數堆：右→左埋入）</text>
  <rect x="220" y="228" width="320" height="26" rx="4" fill="#2563eb"/>
  <text x="380" y="246" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">共振層 320（奇偶堆交錯，間距數十 nm）</text>

  <rect x="220" y="258" width="320" height="30" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="380" y="277" font-size="11" fill="#713f12" text-anchor="middle">絕緣層 430</text>
  <rect x="220" y="292" width="280" height="26" rx="4" fill="#7c3aed"/>
  <text x="360" y="310" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">超導屏蔽層 440（奇數堆：左→右埋入）</text>
  <rect x="220" y="292" width="320" height="26" rx="4" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- side notes -->
  <rect x="20" y="70" width="140" height="248" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="90" y="94" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">三個作用</text>
  <text x="90" y="120" font-size="11" fill="#334155" text-anchor="middle">同面積塞更多</text>
  <text x="90" y="137" font-size="11" fill="#334155" text-anchor="middle">記憶（密度）</text>
  <text x="90" y="168" font-size="11" fill="#334155" text-anchor="middle">層距數十 nm</text>
  <text x="90" y="185" font-size="11" fill="#334155" text-anchor="middle">耦合增強</text>
  <text x="90" y="216" font-size="11" fill="#334155" text-anchor="middle">屏蔽層擋電磁</text>
  <text x="90" y="233" font-size="11" fill="#334155" text-anchor="middle">雜訊，Q 值上升</text>
  <text x="90" y="264" font-size="11" fill="#334155" text-anchor="middle">旁邊還有讀出</text>
  <text x="90" y="281" font-size="11" fill="#334155" text-anchor="middle">單元＋transmon</text>
  <text x="90" y="298" font-size="11" fill="#334155" text-anchor="middle">（FIG.1，不在圖中）</text>

  <rect x="600" y="70" width="140" height="248" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
  <text x="670" y="94" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">製程語言</text>
  <text x="670" y="120" font-size="11" fill="#e2e8f0" text-anchor="middle">同一基板上逐層</text>
  <text x="670" y="137" font-size="11" fill="#e2e8f0" text-anchor="middle">沉積（sequential）</text>
  <text x="670" y="168" font-size="11" fill="#fbbf24" text-anchor="middle">沒有「兩片晶粒</text>
  <text x="670" y="185" font-size="11" fill="#fbbf24" text-anchor="middle">對貼」這一步</text>
  <text x="670" y="216" font-size="11" fill="#e2e8f0" text-anchor="middle">→ 薄膜派，非封裝派</text>
  <text x="670" y="250" font-size="11" fill="#94a3b8" text-anchor="middle">材料：Al／Nb／</text>
  <text x="670" y="267" font-size="11" fill="#94a3b8" text-anchor="middle">NbN／Ta 等</text>
  <text x="670" y="298" font-size="11" fill="#94a3b8" text-anchor="middle">層厚皆非等比繪製</text>

  <text x="380" y="382" font-size="11" fill="#64748b" text-anchor="middle">本站依 US12381298B2 說明書 FIG.4 描述自繪；原圖 FIG.1–6 見 USPTO 全文 PDF（來源節連結）</text>
</svg>
