<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="system-ui, -apple-system, 'PingFang TC', sans-serif">
  <rect width="720" height="520" fill="#f8fafc"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Claude Code 團隊的七層審查（由左至右：越往右越接近上線）</text>
  <g font-size="13" fill="#0f172a">
    <!-- Layer boxes -->
    <rect x="20" y="60" width="92" height="120" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="66" y="82" text-anchor="middle" font-weight="700">1. Pre-PR</text>
    <text x="66" y="100" text-anchor="middle" font-size="11">驗證</text>
    <text x="66" y="120" text-anchor="middle" font-size="10">測試/建置</text>
    <text x="66" y="136" text-anchor="middle" font-size="10">截圖比對</text>
    <text x="66" y="152" text-anchor="middle" font-size="10">subagent 審 diff</text>

    <rect x="122" y="60" width="92" height="120" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="168" y="82" text-anchor="middle" font-weight="700">2. AI 審查</text>
    <text x="168" y="100" text-anchor="middle" font-size="11">每 PR 必跑</text>
    <text x="168" y="120" text-anchor="middle" font-size="10">對照全 repo</text>
    <text x="168" y="136" text-anchor="middle" font-size="10">多 agent 投票</text>
    <text x="168" y="152" text-anchor="middle" font-size="10">過濾 style</text>

    <rect x="224" y="60" width="92" height="120" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="270" y="82" text-anchor="middle" font-weight="700">3. 安全審查</text>
    <text x="270" y="100" text-anchor="middle" font-size="11">可阻擋</text>
    <text x="270" y="120" text-anchor="middle" font-size="10">未解 finding</text>
    <text x="270" y="136" text-anchor="middle" font-size="10">不得合併</text>

    <rect x="326" y="60" width="92" height="120" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="372" y="82" text-anchor="middle" font-weight="700">4. 自動檢查</text>
    <text x="372" y="100" text-anchor="middle" font-size="11">lint/types</text>
    <text x="372" y="120" text-anchor="middle" font-size="10">tests 全平台</text>
    <text x="372" y="136" text-anchor="middle" font-size="10">build</text>

    <rect x="428" y="60" width="92" height="120" rx="10" fill="#fce7f3" stroke="#db2777"/>
    <text x="474" y="82" text-anchor="middle" font-weight="700">5. 人審批</text>
    <text x="474" y="100" text-anchor="middle" font-size="11">依風險分級</text>
    <text x="474" y="120" text-anchor="middle" font-size="10">change not author</text>
    <text x="474" y="136" text-anchor="middle" font-size="10">agent 不算人</text>

    <rect x="530" y="60" width="92" height="120" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="576" y="82" text-anchor="middle" font-weight="700">6. 合併佇列</text>
    <text x="576" y="100" text-anchor="middle" font-size="11">feature flag</text>
    <text x="576" y="120" text-anchor="middle" font-size="10">內部→latest</text>
    <text x="576" y="136" text-anchor="middle" font-size="10">→stable</text>

    <rect x="632" y="60" width="72" height="120" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text x="668" y="82" text-anchor="middle" font-weight="700">7. 回饋</text>
    <text x="668" y="100" text-anchor="middle" font-size="11">rollback</text>
    <text x="668" y="120" text-anchor="middle" font-size="10">on-call</text>
    <text x="668" y="136" text-anchor="middle" font-size="10">incidents</text>
  </g>
  <!-- arrows -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="112" y1="120" x2="122" y2="120"/>
    <line x1="214" y1="120" x2="224" y2="120"/>
    <line x1="316" y1="120" x2="326" y2="120"/>
    <line x1="418" y1="120" x2="428" y2="120"/>
    <line x1="520" y1="120" x2="530" y2="120"/>
    <line x1="622" y1="120" x2="632" y2="120"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <!-- bottom note -->
  <rect x="20" y="200" width="684" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="362" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">回饋迴圈：每次 incident 都加入 eval 集，審查器每日對照整集重評</text>
  <text x="362" y="242" text-anchor="middle" font-size="12" fill="#334155">收斂機制：限制審查輪數（≤3），之後只審 diff；指定 bug 類別；避免重報已知問題</text>
  <text x="362" y="260" text-anchor="middle" font-size="12" fill="#334155">人審批原則：change 決定風險等級，不是 author；agent approval 不計入 required approval</text>
  <!-- metrics box -->
  <rect x="20" y="290" width="684" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="362" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">文章自報指標（Anthropic 自述，未經獨立驗證）</text>
  <g font-size="12" fill="#334155">
    <text x="40" y="340">• 2026 年 5→9 月：monorepo 每日合併變更 2,500 → 30,000+</text>
    <text x="40" y="362">• Claude Code：6–9 月 PR 合併數量翻倍；PR 被 revert 的比例下降 >40%</text>
    <text x="40" y="384">• 有實質 review comment 的內部 PR：16% → 54%（research preview 上線後）</text>
    <text x="40" y="406">• Code Review 在 >1,000 行 PR 上多數能抓到問題；小 PR 多數乾淨</text>
    <text x="40" y="428">• 收斂前：某 CLI PR 一夜 cycle 超過 50 次；~59% 被標記的程式碼是初版就存在</text>
    <text x="40" y="450">• verification process 估計把 Claude 輸出品質提升 2–3 倍（Boris Cherny）</text>
    <text x="40" y="472">• 目標：多數 PR ≤1 位人類參與合併，revert/incident 不上升</text>
  </g>
</svg>
