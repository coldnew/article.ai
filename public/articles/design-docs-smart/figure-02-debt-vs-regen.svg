<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="720" height="300" fill="#faf9f5"/>
  <text x="24" y="30" font-size="16" font-weight="bold" fill="#141413">增量修補 vs 整庫重生：技術債的兩種結帳方式</text>

  <!-- left: incremental debt -->
  <text x="24" y="60" font-size="14" font-weight="bold" fill="#8a5a2b">傳統：增量修補</text>
  <g font-size="12" fill="#141413">
    <rect x="24" y="72" width="310" height="34" rx="6" fill="#fff" stroke="#8a5a2b"/>
    <text x="36" y="94">新硬體出現 → 補一個 if、繞一個抽象層</text>
    <rect x="24" y="112" width="310" height="34" rx="6" fill="#fff" stroke="#8a5a2b"/>
    <text x="36" y="134">新模型出現 → 再疊一層相容墊片</text>
    <rect x="24" y="152" width="310" height="34" rx="6" fill="#fff" stroke="#8a5a2b"/>
    <text x="36" y="174">三年後 → 沒人敢動，全是地雷</text>
  </g>
  <text x="24" y="212" font-size="13" font-weight="bold" fill="#8a5a2b">incremental generation debt 只增不減</text>
  <text x="24" y="232" font-size="12" fill="#6b6a64">人類重寫整庫太貴，只能一直 patch</text>

  <!-- divider -->
  <line x1="360" y1="48" x2="360" y2="270" stroke="#e8e6dc" stroke-width="2"/>

  <!-- right: regen -->
  <text x="386" y="60" font-size="14" font-weight="bold" fill="#1b365d">SMART：整庫重生</text>
  <g font-size="12" fill="#141413">
    <rect x="386" y="72" width="310" height="34" rx="6" fill="#fff" stroke="#1b365d"/>
    <text x="398" y="94">spec 一改 → 丟掉全部 code</text>
    <rect x="386" y="112" width="310" height="34" rx="6" fill="#fff" stroke="#1b365d"/>
    <text x="398" y="134">agent 照 doc 重編：1.5–3 小時</text>
    <rect x="386" y="152" width="310" height="34" rx="6" fill="#fff" stroke="#1b365d"/>
    <text x="398" y="174">API 花費約 $100，債務歸零</text>
  </g>
  <text x="386" y="212" font-size="13" font-weight="bold" fill="#1b365d">每次更新都是一次 clean-slate</text>
  <text x="386" y="232" font-size="12" fill="#6b6a64">錨點：DeepSeek-V3 TPU 模型對到捨入精度</text>

  <text x="24" y="270" font-size="12" fill="#6b6a64">前提：doc 要寫到 agent 能一次編對——含糊意圖會在生成階段立刻現形。</text>
</svg>
