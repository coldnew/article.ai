<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <style>
      .t { font-size: 15px; fill: #1f2937; }
      .s { font-size: 12.5px; fill: #6b7280; }
      .h { font-size: 13px; fill: #374151; font-weight: 700; }
      .cap { font-size: 12px; fill: #9ca3af; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="340" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="28" y="34" font-size="18" font-weight="700" fill="#111827">fab24hr：打開時間決定你從哪一班開始（每班 6 小時，四班接成 24 小時）</text>

  <!-- axis -->
  <line x1="60" y1="120" x2="900" y2="120" stroke="#d1d5db" stroke-width="2"/>
  <g font-size="12" fill="#6b7280">
    <text x="60" y="142" text-anchor="middle">00:00</text>
    <text x="270" y="142" text-anchor="middle">06:00</text>
    <text x="480" y="142" text-anchor="middle">12:00</text>
    <text x="690" y="142" text-anchor="middle">18:00</text>
    <text x="900" y="142" text-anchor="middle">24:00</text>
  </g>

  <!-- shift blocks -->
  <g>
    <rect x="60" y="70" width="210" height="50" rx="8" fill="#312e81"/>
    <text x="165" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">深夜班「那通電話」</text>
    <text x="165" y="108" text-anchor="middle" font-size="12" fill="#c7d2fe">02:47 on-call，只能隔電話指揮</text>

    <rect x="270" y="70" width="210" height="50" rx="8" fill="#b91c1c"/>
    <text x="375" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">早班「救火」</text>
    <text x="375" y="108" text-anchor="middle" font-size="12" fill="#fecaca">交接單・晨會・查因・測機復機</text>

    <rect x="480" y="70" width="210" height="50" rx="8" fill="#b45309"/>
    <text x="585" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">午班「趕時間」</text>
    <text x="585" y="108" text-anchor="middle" font-size="12" fill="#fde68a">手動補做晶圓・檢討報告・檢討會</text>

    <rect x="690" y="70" width="210" height="50" rx="8" fill="#0f766e"/>
    <text x="795" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">晚班「下班未遂」</text>
    <text x="795" y="108" text-anchor="middle" font-size="12" fill="#99f6e4">走到門口被叫住・最後一顆黃燈</text>
  </g>

  <!-- markers -->
  <g>
    <line x1="147" y1="120" x2="147" y2="160" stroke="#312e81" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="147" y="178" text-anchor="middle" class="h">02:47 手機響</text>
    <text x="147" y="196" text-anchor="middle" class="s">ETCH-03 當機・急件卡住</text>

    <line x1="330" y1="120" x2="330" y2="160" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="330" y="178" text-anchor="middle" class="h">08:30 晨會</text>
    <text x="330" y="196" text-anchor="middle" class="s">MOVE 82%・紅燈・被問幾點會好</text>

    <line x1="583" y1="120" x2="583" y2="160" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="583" y="178" text-anchor="middle" class="h">13:40 手動補做</text>
    <text x="583" y="196" text-anchor="middle" class="s">無系統幫你擋・每個人都在催</text>

    <line x1="830" y1="120" x2="830" y2="160" stroke="#0f766e" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="830" y="178" text-anchor="middle" class="h">機台前的黃燈</text>
    <text x="830" y="196" text-anchor="middle" class="s">一天的結尾・下一班的開頭</text>
  </g>

  <!-- loop note -->
  <rect x="60" y="222" width="840" height="66" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="80" y="248" class="t">每班幾分鐘可上完 → 結算卡（可分享到 FB／LINE／IG 限動）→ 接著上下一班；進度存在瀏覽器裡，離開再回來可接著玩。</text>
  <text x="80" y="270" class="s">本站實測：下午打開直接從「午班 13:40 趕時間」開始，與「打開時間決定起始班」的設計相符（見站內截圖）。各班時數以 python3 驗算：4 班 × 6 小時＝24 小時。</text>
  <text x="80" y="312" class="cap">圖：本站依 fab24hr《關於》頁「一天有四個班」表格自繪；事件文案轉述自該頁班名與劇情簡介。</text>
</svg>
