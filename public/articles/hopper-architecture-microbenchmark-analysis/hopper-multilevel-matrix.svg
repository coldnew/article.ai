<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" font-family="-apple-system, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <rect x="0" y="0" width="920" height="600" rx="12" fill="#f8fafc"/>
  <text x="460" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Hopper 五大單元 × 三層評估覆蓋矩陣</text>
  <text x="460" y="60" text-anchor="middle" font-size="12" fill="#64748b">自繪整理自 arXiv:2501.12084 章節結構；函式庫層僅 Tensor Core 有 Transformer Engine 實測</text>

  <!-- column headers -->
  <g font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">
    <text x="300" y="100">指令層</text>
    <text x="530" y="100">函式庫層</text>
    <text x="760" y="100">應用層</text>
  </g>

  <!-- row labels + cells -->
  <g font-size="13">
    <!-- row 1 memory -->
    <text x="14" y="165" font-weight="700" fill="#1e293b">記憶體子系統</text>
    <rect x="170" y="130" width="220" height="62" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="280" y="153" text-anchor="middle" fill="#1e293b">P-chase 延遲＋吞吐</text>
    <text x="280" y="172" text-anchor="middle" fill="#4c1d95" font-weight="700">L2 雙分區 near/far 四群</text>
    <rect x="420" y="130" width="220" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <text x="530" y="162" text-anchor="middle" fill="#94a3b8">（本單元無）</text>
    <rect x="650" y="130" width="220" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <text x="760" y="162" text-anchor="middle" fill="#94a3b8">（本單元無）</text>

    <!-- row 2 TMA -->
    <text x="14" y="245" font-weight="700" fill="#1e293b">TMA 非同步搬運</text>
    <rect x="170" y="210" width="220" height="62" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="280" y="233" text-anchor="middle" fill="#1e293b">延遲＋170 cycles 開銷</text>
    <text x="280" y="252" text-anchor="middle" fill="#4c1d95" font-weight="700">吞吐可破 1800GB/s</text>
    <rect x="420" y="210" width="220" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <text x="530" y="242" text-anchor="middle" fill="#94a3b8">（本單元無）</text>
    <rect x="650" y="210" width="220" height="62" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="760" y="233" text-anchor="middle" fill="#1e293b">GEMM 600 vs 450 TFLOPS</text>
    <text x="760" y="252" text-anchor="middle" fill="#b45309" font-weight="700">約 1.33x ≠ 標題 1.5x</text>

    <!-- row 3 Tensor Core -->
    <text x="14" y="325" font-weight="700" fill="#1e293b">Tensor Core</text>
    <rect x="170" y="290" width="220" height="62" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="280" y="313" text-anchor="middle" fill="#1e293b">mma 僅 62.9% 峰值</text>
    <text x="280" y="332" text-anchor="middle" fill="#4c1d95" font-weight="700">wgmma 破 95%，撞 350W 牆</text>
    <rect x="420" y="290" width="220" height="62" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="530" y="313" text-anchor="middle" fill="#1e293b">Transformer Engine</text>
    <text x="530" y="332" text-anchor="middle" fill="#4c1d95" font-weight="700">FP8 近 2x（大任務限定）</text>
    <rect x="650" y="290" width="220" height="62" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="760" y="313" text-anchor="middle" fill="#1e293b">Llama 推論 memory-bound</text>
    <text x="760" y="332" text-anchor="middle" fill="#4c1d95" font-weight="700">FP8 幾乎無感</text>

    <!-- row 4 DSM -->
    <text x="14" y="405" font-weight="700" fill="#1e293b">DSM 跨 SM 通訊</text>
    <rect x="170" y="370" width="220" height="62" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="280" y="393" text-anchor="middle" fill="#1e293b">跨 SM 181 cycles</text>
    <text x="280" y="412" text-anchor="middle" fill="#4c1d95" font-weight="700">為全球記憶體 1/6.13</text>
    <rect x="420" y="370" width="220" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <text x="530" y="402" text-anchor="middle" fill="#94a3b8">（本單元無）</text>
    <rect x="650" y="370" width="220" height="62" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="760" y="393" text-anchor="middle" fill="#1e293b">Histogram 快三成以上</text>
    <text x="760" y="412" text-anchor="middle" fill="#4c1d95" font-weight="700">broadcast 是反模式</text>

    <!-- row 5 DPX -->
    <text x="14" y="485" font-weight="700" fill="#1e293b">DPX 動態規劃</text>
    <rect x="170" y="450" width="220" height="62" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="280" y="473" text-anchor="middle" fill="#1e293b">16 位元最高 13x</text>
    <text x="280" y="492" text-anchor="middle" fill="#4c1d95" font-weight="700">S32 幾無加速</text>
    <rect x="420" y="450" width="220" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <text x="530" y="482" text-anchor="middle" fill="#94a3b8">（本單元無）</text>
    <rect x="650" y="450" width="220" height="62" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="760" y="473" text-anchor="middle" fill="#1e293b">Smith-Waterman S16</text>
    <text x="760" y="492" text-anchor="middle" fill="#4c1d95" font-weight="700">4.75x（全場最快是 4090）</text>
  </g>

  <g font-size="12" fill="#64748b">
    <rect x="170" y="535" width="14" height="14" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="190" y="547">有實測</text>
    <rect x="260" y="535" width="14" height="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="280" y="547">該層未測</text>
    <rect x="370" y="535" width="14" height="14" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="390" y="547">標題與內文有落差，見對照表</text>
  </g>
</svg>
