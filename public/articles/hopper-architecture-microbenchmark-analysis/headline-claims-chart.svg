<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="-apple-system, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <rect x="0" y="0" width="920" height="560" rx="12" fill="#f8fafc"/>
  <text x="460" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">摘要四組數字：宣稱值 vs 內文實測落點</text>
  <text x="460" y="60" text-anchor="middle" font-size="12" fill="#64748b">自繪對照；柱長按同組內比例繪製，僅 TMA 組標出標題值對應位置</text>

  <g font-size="13" font-weight="700" fill="#1e293b">
    <text x="14" y="130">TMA・GEMM（TFLOPS）</text>
    <text x="14" y="240">FP8・wgmma（TFLOPS）</text>
    <text x="14" y="350">DPX（加速倍數）</text>
    <text x="14" y="460">DSM（跨 SM 延遲 cycles）</text>
  </g>

  <!-- TMA group: baseline 450, measured 600, claimed 675 -->
  <g font-size="12">
    <rect x="230" y="102" width="300" height="24" rx="4" fill="#cbd5e1"/>
    <text x="236" y="119" fill="#334155">關 TMA 約 450</text>
    <rect x="230" y="130" width="400" height="24" rx="4" fill="#8b5cf6"/>
    <text x="236" y="147" fill="#ffffff">開 TMA 約 600（實測 1.33x）</text>
    <line x1="680" y1="98" x2="680" y2="158" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="686" y="120" fill="#b45309" font-weight="700">標題 1.5x 應為 675</text>
    <text x="686" y="137" fill="#b45309">曲線未達，見內文</text>
  </g>

  <!-- FP8 group: 729 vs 1448 -->
  <g font-size="12">
    <rect x="230" y="212" width="232" height="24" rx="4" fill="#cbd5e1"/>
    <text x="236" y="229" fill="#334155">FP16 729.3</text>
    <rect x="230" y="240" width="460" height="24" rx="4" fill="#10b981"/>
    <text x="236" y="257" fill="#ffffff">FP8 1448.4（實測 1.99x，成立）</text>
  </g>

  <!-- DPX group: 13x micro vs 4.75x app -->
  <g font-size="12">
    <rect x="230" y="322" width="460" height="24" rx="4" fill="#8b5cf6"/>
    <text x="236" y="339" fill="#ffffff">微基準 16 位元最高 13x</text>
    <rect x="230" y="350" width="168" height="24" rx="4" fill="#10b981"/>
    <text x="236" y="367" fill="#ffffff">應用 S-W 4.75x</text>
    <text x="410" y="367" fill="#64748b">← 同一技術，口徑不同：指令峰值 vs 端到端</text>
  </g>

  <!-- DSM group: 1110 vs 181 (scale: 1110 -> 460px) -->
  <g font-size="12">
    <rect x="230" y="432" width="460" height="24" rx="4" fill="#cbd5e1"/>
    <text x="236" y="449" fill="#334155">經全球記憶體 1110</text>
    <rect x="230" y="460" width="75" height="24" rx="4" fill="#10b981"/>
    <text x="310" y="477" fill="#1e293b">DSM 181（6.13x，成立）</text>
  </g>

  <g font-size="12" fill="#64748b">
    <rect x="230" y="508" width="14" height="14" fill="#8b5cf6"/>
    <text x="250" y="520">Hopper 新單元實測</text>
    <rect x="400" y="508" width="14" height="14" fill="#10b981"/>
    <text x="420" y="520">對照組／應用層落點</text>
    <rect x="600" y="508" width="14" height="14" fill="#cbd5e1"/>
    <text x="620" y="520">基線</text>
  </g>
</svg>
