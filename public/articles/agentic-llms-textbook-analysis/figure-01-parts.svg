<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="1200" height="560" rx="16" fill="#1b2432"/>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Agentic LLM = LLM + Harness</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#9fb0c7">本書核心公式（第 1.2.2 節）：模型之外，包一層負責組提示詞、調工具、管狀態的程式碼</text>

  <g font-size="15" font-weight="700" text-anchor="middle">
    <g>
      <rect x="20" y="100" width="148" height="120" rx="10" fill="#2f6f4f"/>
      <text x="94" y="128" fill="#ffffff">I · 語言建模</text>
      <text x="94" y="152" font-size="13" font-weight="400" fill="#d7e5d8">Ch 2–5</text>
      <text x="94" y="174" font-size="12" font-weight="400" fill="#d7e5d8">token / 訓練管線</text>
      <text x="94" y="194" font-size="12" font-weight="400" fill="#d7e5d8">scaling law / 實作</text>
    </g>
    <g>
      <rect x="184" y="100" width="148" height="120" rx="10" fill="#8a5a2b"/>
      <text x="258" y="128" fill="#ffffff">II · 推理</text>
      <text x="258" y="152" font-size="13" font-weight="400" fill="#f0e2cc">Ch 6–8</text>
      <text x="258" y="174" font-size="12" font-weight="400" fill="#f0e2cc">CoT / 自我反思</text>
      <text x="258" y="194" font-size="12" font-weight="400" fill="#f0e2cc">世界模型 / 元學習</text>
    </g>
    <g>
      <rect x="348" y="100" width="148" height="120" rx="10" fill="#2b5f8a"/>
      <text x="422" y="128" fill="#ffffff">III · Agent</text>
      <text x="422" y="152" font-size="13" font-weight="400" fill="#d3e4f2">Ch 9–10</text>
      <text x="422" y="174" font-size="12" font-weight="400" fill="#d3e4f2">互動型式 A–E</text>
      <text x="422" y="194" font-size="12" font-weight="400" fill="#d3e4f2">記憶架構</text>
    </g>
    <g>
      <rect x="512" y="100" width="148" height="120" rx="10" fill="#6b3f8a"/>
      <text x="586" y="128" fill="#ffffff">IV · 工具助手</text>
      <text x="586" y="152" font-size="13" font-weight="400" fill="#e5d8f2">Ch 11–14</text>
      <text x="586" y="174" font-size="12" font-weight="400" fill="#e5d8f2">工具 / MCP / RAG</text>
      <text x="586" y="194" font-size="12" font-weight="400" fill="#e5d8f2">購物醫療交易助手</text>
    </g>
    <g>
      <rect x="676" y="100" width="148" height="120" rx="10" fill="#8a2f4d"/>
      <text x="750" y="128" fill="#ffffff">V · 行為認知</text>
      <text x="750" y="152" font-size="13" font-weight="400" fill="#f2d8e0">Ch 15–18</text>
      <text x="750" y="174" font-size="12" font-weight="400" fill="#f2d8e0">心智理論 / 道德</text>
      <text x="750" y="194" font-size="12" font-weight="400" fill="#f2d8e0">湧現行為 / 模擬</text>
    </g>
    <g>
      <rect x="840" y="100" width="148" height="120" rx="10" fill="#4d4d6b"/>
      <text x="914" y="128" fill="#ffffff">VI · 進階 *</text>
      <text x="914" y="152" font-size="13" font-weight="400" fill="#dcdcef">Ch 19–22</text>
      <text x="914" y="174" font-size="12" font-weight="400" fill="#dcdcef">合成資料 / 架構</text>
      <text x="914" y="194" font-size="12" font-weight="400" fill="#dcdcef">可解釋性 / 意識</text>
    </g>
    <g>
      <rect x="1004" y="100" width="176" height="120" rx="10" fill="#3a3f4a"/>
      <text x="1092" y="128" fill="#ffffff">VII · 結論</text>
      <text x="1092" y="152" font-size="13" font-weight="400" fill="#d5d8de">Ch 23</text>
      <text x="1092" y="174" font-size="12" font-weight="400" fill="#d5d8de">現狀 / 侷限</text>
      <text x="1092" y="194" font-size="12" font-weight="400" fill="#d5d8de">犯罪 / 法律倫理</text>
    </g>
  </g>

  <text x="600" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">四個實作案例（評分作業就是這四個）</text>
  <g font-size="14" text-anchor="middle">
    <g>
      <rect x="20" y="278" width="275" height="96" rx="10" fill="#24425f"/>
      <text x="157" y="306" font-weight="700" fill="#ffffff">案例 1 · 從零建造 LLM</text>
      <text x="157" y="330" font-size="12" fill="#c6d8ea">Ch 5 · 跟著 Karpathy nanochat</text>
      <text x="157" y="350" font-size="12" fill="#c6d8ea">tokenizer → 預訓練 → SFT → 部署</text>
    </g>
    <g>
      <rect x="315" y="278" width="275" height="96" rx="10" fill="#24425f"/>
      <text x="452" y="306" font-weight="700" fill="#ffffff">案例 2 · 推理與反思</text>
      <text x="452" y="330" font-size="12" fill="#c6d8ea">Ch 10 · BALROG 謎題與遊戲基準</text>
      <text x="452" y="350" font-size="12" fill="#c6d8ea">ReAct / Reflexion 實作比較</text>
    </g>
    <g>
      <rect x="610" y="278" width="275" height="96" rx="10" fill="#24425f"/>
      <text x="747" y="306" font-weight="700" fill="#ffffff">案例 3 · 多 Agent 診斷</text>
      <text x="747" y="330" font-size="12" fill="#c6d8ea">Ch 14 · 規則規劃器換成 LLM</text>
      <text x="747" y="350" font-size="12" fill="#c6d8ea">附醫療免責：不可盲從建議</text>
    </g>
    <g>
      <rect x="905" y="278" width="275" height="96" rx="10" fill="#24425f"/>
      <text x="1042" y="306" font-weight="700" fill="#ffffff">案例 4 · 社會模擬</text>
      <text x="1042" y="330" font-size="12" fill="#c6d8ea">Ch 18 · 生成式 Agent 社會</text>
      <text x="1042" y="350" font-size="12" fill="#c6d8ea">記憶檢索：基線 vs 負向偏置</text>
    </g>
  </g>

  <g font-size="14" text-anchor="middle">
    <rect x="20" y="400" width="570" height="120" rx="10" fill="#22303f"/>
    <text x="305" y="428" font-weight="700" fill="#7ee2a8">路線 A · 助手（assist）</text>
    <text x="305" y="452" font-size="13" fill="#c6d8ea">讀 II ＋ III ＋ IV，作業做案例 2、3</text>
    <text x="305" y="474" font-size="13" fill="#c6d8ea">購物 / 醫療 / 交易 / 科研 / 程式助手</text>
    <text x="305" y="496" font-size="13" fill="#c6d8ea">選修 Ch 19 合成資料</text>
  </g>
  <g font-size="14" text-anchor="middle">
    <rect x="610" y="400" width="570" height="120" rx="10" fill="#33272f"/>
    <text x="895" y="428" font-weight="700" fill="#f2a8c0">路線 B · 社會模擬（interact）</text>
    <text x="895" y="452" font-size="13" fill="#ead6dd">讀 II ＋ III ＋ V，作業做案例 2、4</text>
    <text x="895" y="474" font-size="13" fill="#ead6dd">角色協作 / 辯論 / 湧現規範</text>
    <text x="895" y="496" font-size="13" fill="#ead6dd">選修 Ch 22 認知視角</text>
  </g>
  <text x="600" y="544" text-anchor="middle" font-size="12" fill="#8a97a8">自繪結構圖，資料來源：《Agentic Large Language Models》第 1.5 節 Table 1.1 與各章標題（arXiv:2610.13455）</text>
</svg>
