<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="-apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <rect x="0" y="0" width="1200" height="420" rx="16" fill="#ffffff" stroke="#e5e0d5"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1c1917">US D1,151,323 S 時間線：發表前一天卡位，兩年後授權</text>
  <text x="40" y="74" font-size="14" fill="#78716c">底本：USPTO 首頁（申請日 2024-10-09・授權日 2026-10-06）＋ BBC／USA Today 的 We, Robot 報導</text>

  <line x1="60" y1="220" x2="1140" y2="220" stroke="#d6d3d1" stroke-width="3"/>

  <g font-size="15" font-weight="700">
    <circle cx="150" cy="220" r="13" fill="#ea580c"/>
    <text x="150" y="180" text-anchor="middle" fill="#9a3412">2024-10-09</text>
    <text x="150" y="260" text-anchor="middle" fill="#1c1917">美國外觀申請</text>
    <text x="150" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#57534e">Appl. 29/967,282</text>
  </g>

  <g font-size="15" font-weight="700">
    <circle cx="420" cy="220" r="13" fill="#0ea5e9"/>
    <text x="420" y="180" text-anchor="middle" fill="#0c4a6e">2024-10-10</text>
    <text x="420" y="260" text-anchor="middle" fill="#1c1917">We, Robot 發表會</text>
    <text x="420" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#57534e">Cybercab 首亮相・僅隔 1 天</text>
  </g>

  <g font-size="15" font-weight="700">
    <circle cx="700" cy="220" r="13" fill="#0ea5e9"/>
    <text x="700" y="180" text-anchor="middle" fill="#0c4a6e">2025-04</text>
    <text x="700" y="260" text-anchor="middle" fill="#1c1917">歐盟 4 件註冊</text>
    <text x="700" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#57534e">EM 015098417-0001～0004</text>
  </g>

  <g font-size="15" font-weight="700">
    <circle cx="990" cy="220" r="14" fill="#16a34a"/>
    <text x="990" y="180" text-anchor="middle" fill="#166534">2026-10-06</text>
    <text x="990" y="260" text-anchor="middle" fill="#1c1917">美國授權公告</text>
    <text x="990" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#57534e">15 年期・至約 2041 年</text>
  </g>

  <text x="40" y="350" font-size="14" fill="#57534e">關鍵：外觀設計採「絕對新穎性」審查——在公開發表前先申請，是標準卡位動作，不只是故事張力。</text>
  <text x="40" y="376" font-size="14" fill="#57534e">缺口：日本意匠出願（2025-007220）2025-09-24 已收拒絕理由通知，全球佈局並非無縫。</text>
</svg>
