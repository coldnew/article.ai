<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui, 'Noto Sans TC', sans-serif">
  <text x="20" y="28" font-size="16" font-weight="700" fill="#333">誘因對照：商業 App 靠挫折賺錢，政府版靠什麼？</text>
  <text x="20" y="56" font-size="13" font-weight="700" fill="#999">商業交友 App（HN 留言共識）</text>
  <rect x="20" y="66" width="320" height="110" rx="8" fill="#fdecea"/>
  <text x="34" y="90" font-size="12" fill="#333">3000 人按讚隊伍只增不減（vidarh 友人例）</text>
  <text x="34" y="108" font-size="12" fill="#333">不隱藏不活躍帳號、深隊伍照樣曝光</text>
  <text x="34" y="126" font-size="12" fill="#333">單向喜歡多配、雙向喜歡少配</text>
  <text x="34" y="144" font-size="12" fill="#333">目標：swipe 多、connection 少→付費解鎖</text>
  <text x="20" y="196" font-size="13" font-weight="700" fill="#666">⇅ 註：留言稱女性約選 5%、男性約選 50%，皆為留言者單方說法，未獨立核實</text>
  <text x="380" y="56" font-size="13" font-weight="700" fill="#999">FirstDate 政府版（原文明說）</text>
  <rect x="380" y="66" width="320" height="110" rx="8" fill="#e6f4ea"/>
  <text x="394" y="90" font-size="12" fill="#333">Singpass 驗證＋每輪只給一個配對</text>
  <text x="394" y="108" font-size="12" fill="#333">雙方同意才交換聯絡方式</text>
  <text x="394" y="126" font-size="12" fill="#333">無付費解鎖、無留人動機</text>
  <text x="394" y="144" font-size="12" fill="#333">目標：脫單（但赴約仍自願）</text>
  <rect x="20" y="220" width="680" height="82" rx="8" fill="#fff8e1"/>
  <text x="34" y="244" font-size="13" font-weight="700" fill="#333">作者與 HN 的共同提醒：換掉誘因 ≠ 解決問題</text>
  <text x="34" y="264" font-size="12" fill="#333">問卷式配對仍是清單思維；化學反應來自無聊、壓力與混亂中的相處，不在排序表裡</text>
  <text x="34" y="282" font-size="12" fill="#666">作者處方：投資 third spaces，讓人為事情相聚，而非為配對相聚</text>
</svg>
