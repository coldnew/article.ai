<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="720" height="300" fill="#faf9f5"/>
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#141413">KV cache 才是帳單殺手</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b6a64">以下為轉述貼文數字，單一來源，待官方技術報告核對</text>
  <g>
    <text x="120" y="110" text-anchor="middle" font-size="13" fill="#6b6a64">單 token 上下文狀態</text>
    <text x="120" y="150" text-anchor="middle" font-size="26" font-weight="bold" fill="#8a5a2b">約 890 位元組</text>
    <text x="120" y="178" text-anchor="middle" font-size="13" fill="#6b6a64">相對 V1 縮小約 437 倍</text>
  </g>
  <g>
    <text x="360" y="110" text-anchor="middle" font-size="13" fill="#6b6a64">HBM 佔用</text>
    <text x="360" y="150" text-anchor="middle" font-size="26" font-weight="bold" fill="#1b365d">約上一代 1/4</text>
    <text x="360" y="178" text-anchor="middle" font-size="13" fill="#6b6a64">第三方稱 KV 佔用約 1/4，方向一致</text>
  </g>
  <g>
    <text x="600" y="110" text-anchor="middle" font-size="13" fill="#6b6a64">SSD 佔用</text>
    <text x="600" y="150" text-anchor="middle" font-size="26" font-weight="bold" fill="#1b365d">約 1/8</text>
    <text x="600" y="178" text-anchor="middle" font-size="13" fill="#6b6a64">長上下文落地成本降</text>
  </g>
  <line x1="60" y1="210" x2="660" y2="210" stroke="#e8e6dc" stroke-width="1"/>
  <text x="360" y="240" text-anchor="middle" font-size="13" fill="#141413">小成本大智能：8B 讀 ＋ 16B 寫 ＋ 極小 KV ＝ 推理帳單重寫</text>
  <text x="360" y="264" text-anchor="middle" font-size="12" fill="#6b6a64">Fireworks 標價 $0.90 / $0.45 / $0.90 每百萬 tokens（輸入／快取／輸出）</text>
</svg>
