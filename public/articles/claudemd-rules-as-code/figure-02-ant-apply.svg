  <text x="105" y="118" text-anchor="middle" font-size="12" fill="#6b6a64">agents/ skills/</text>
  <text x="105" y="137" text-anchor="middle" font-size="12" fill="#6b6a64">environments/</text>
  <text x="105" y="156" text-anchor="middle" font-size="12" fill="#6b6a64">memory stores</text>
  <rect x="225" y="60" width="150" height="120" rx="8" fill="#fff" stroke="#1b365d" stroke-width="2"/>
  <text x="300" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#141413">ant apply</text>
  <text x="300" y="118" text-anchor="middle" font-size="12" fill="#6b6a64">印出計劃</text>
  <text x="300" y="137" text-anchor="middle" font-size="12" fill="#6b6a64">人工審批</text>
  <text x="300" y="156" text-anchor="middle" font-size="12" fill="#6b6a64">y / n / details</text>
  <rect x="420" y="60" width="120" height="120" rx="8" fill="#1b365d"/>
  <text x="480" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#faf9f5">claude-lock</text>
  <text x="480" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#faf9f5">.json</text>
