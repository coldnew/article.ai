  <line x1="540" y1="120" x2="582" y2="120" stroke="#1b365d" stroke-width="2"/>
  <path d="M 637 185 C 637 225 300 225 300 190" fill="none" stroke="#8a5a2b" stroke-width="1.5" stroke-dasharray="5 4"/>
