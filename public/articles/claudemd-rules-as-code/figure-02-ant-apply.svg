  <rect x="585" y="60" width="105" height="120" rx="8" fill="#fff" stroke="#1b365d" stroke-width="2"/>
  <text x="637" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#141413">本地 / CI</text>
  <text x="637" y="118" text-anchor="middle" font-size="12" fill="#6b6a64">更新同一組</text>
