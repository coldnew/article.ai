<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="頸部伸展順序示意">
<rect x="0" y="0" width="800" height="260" rx="16" fill="#fffdf7" stroke="#e5ddd0"/>
<text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#333">首こり解消の順番（本站重繪，非原圖）</text>
<g font-size="15" font-weight="700">
<rect x="30" y="60" width="160" height="140" rx="12" fill="#fef3c7" stroke="#d97706"/>
<text x="110" y="90" text-anchor="middle" fill="#92400e">STEP 1</text>
<text x="110" y="115" text-anchor="middle" fill="#333">下巴後收</text>
<text x="110" y="138" text-anchor="middle" font-weight="400" font-size="13" fill="#555">10回</text>
<text x="110" y="160" text-anchor="middle" font-weight="400" font-size="13" fill="#555">腰不後仰</text>
<rect x="230" y="60" width="160" height="140" rx="12" fill="#dcfce7" stroke="#16a34a"/>
<text x="310" y="90" text-anchor="middle" fill="#166534">STEP 2</text>
<text x="310" y="115" text-anchor="middle" fill="#333">鬆頸前側</text>
<text x="310" y="138" text-anchor="middle" font-weight="400" font-size="13" fill="#555">闊頸肌</text>
<text x="310" y="160" text-anchor="middle" font-weight="400" font-size="13" fill="#555">7秒×3 / 3秒×7</text>
<rect x="430" y="60" width="160" height="140" rx="12" fill="#e0e7ff" stroke="#4f46e5"/>
<text x="510" y="90" text-anchor="middle" fill="#3730a3">STEP 3</text>
<text x="510" y="115" text-anchor="middle" fill="#333">鬆後頭部</text>
<text x="510" y="138" text-anchor="middle" font-weight="400" font-size="13" fill="#555">後頭下筋群</text>
<text x="510" y="160" text-anchor="middle" font-weight="400" font-size="13" fill="#555">3秒×7</text>
<rect x="630" y="60" width="140" height="140" rx="12" fill="#f1f5f9" stroke="#64748b"/>
<text x="700" y="90" text-anchor="middle" fill="#334155">原則</text>
<text x="700" y="118" text-anchor="middle" font-weight="400" font-size="13" fill="#333">吐氣做</text>
<text x="700" y="140" text-anchor="middle" font-weight="400" font-size="13" fill="#333">不憋氣</text>
<text x="700" y="162" text-anchor="middle" font-weight="400" font-size="13" fill="#333">不硬扳</text>
</g>
<g fill="#94a3b8" font-size="28" font-weight="700">
<text x="198" y="140">›</text>
<text x="398" y="140">›</text>
<text x="598" y="140">›</text>
</g>
<text x="400" y="230" text-anchor="middle" font-size="13" fill="#64748b">先頸前、再頸後。只抬頭不收腹＝無效，這是本文核心。</text>
</svg>
