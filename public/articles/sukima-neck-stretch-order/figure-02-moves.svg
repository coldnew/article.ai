<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="三個動作要點示意">
<rect x="0" y="0" width="800" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#333">三個動作要點（本站重繪）</text>
<g font-size="14" fill="#333">
<g>
<rect x="30" y="50" width="230" height="220" rx="12" fill="#fffbeb" stroke="#e5ddd0"/>
<text x="145" y="78" text-anchor="middle" font-weight="700">① 下巴後收</text>
<circle cx="145" cy="130" r="34" fill="#e2e8f0"/>
<path d="M145 115 L145 145 M130 130 L160 130" stroke="#475569" stroke-width="3"/>
<path d="M160 130 L150 122 M160 130 L150 138" stroke="#dc2626" stroke-width="3" fill="none"/>
<text x="145" y="190" text-anchor="middle" font-size="13">手指推下巴水平後移</text>
<text x="145" y="210" text-anchor="middle" font-size="13">肚子輕出力、腰不反</text>
<text x="145" y="232" text-anchor="middle" font-size="13" font-weight="700">10回</text>
</g>
<g>
<rect x="285" y="50" width="230" height="220" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="400" y="78" text-anchor="middle" font-weight="700">② 頸前伸展</text>
<path d="M370 120 Q400 110 430 120 L425 170 Q400 180 375 170 Z" fill="#fecaca" stroke="#b91c1c"/>
<path d="M400 110 L400 95" stroke="#16a34a" stroke-width="3"/>
<text x="400" y="190" text-anchor="middle" font-size="13">背打直＋縮腹＋抬頭</text>
<text x="400" y="210" text-anchor="middle" font-size="13">手背後交握 / 拇指輕托</text>
<text x="400" y="232" text-anchor="middle" font-size="13" font-weight="700">7秒×3 / 3秒×7</text>
</g>
<g>
<rect x="540" y="50" width="230" height="220" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="655" y="78" text-anchor="middle" font-weight="700">③ 後頭部伸展</text>
<circle cx="655" cy="125" r="30" fill="#e2e8f0"/>
<path d="M630 125 Q655 150 680 125" stroke="#4f46e5" stroke-width="3" fill="none"/>
<text x="655" y="190" text-anchor="middle" font-size="13">坐姿、雙手腦後交握</text>
<text x="655" y="210" text-anchor="middle" font-size="13">背直、只有頭前傾</text>
<text x="655" y="232" text-anchor="middle" font-size="13" font-weight="700">3秒×7</text>
</g>
</g>
<text x="400" y="290" text-anchor="middle" font-size="12" fill="#64748b">全部吐氣做、不憋氣、麻痛暈即停。</text>
</svg>
