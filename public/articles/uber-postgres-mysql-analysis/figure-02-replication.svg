<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect x="0" y="0" width="720" height="340" fill="#faf9f5"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#141413">複寫層的代差：物理位元組 vs 邏輯敘述</text>
  <text x="24" y="58" font-size="12" fill="#6b6a64">本站依原文複寫章節重繪；右側三個後果是同一設計選擇長出來的</text>

  <rect x="24" y="76" width="328" height="224" fill="#fff" stroke="#c0392b" stroke-width="2" rx="8"/>
  <text x="44" y="106" font-size="15" font-weight="bold" fill="#c0392b">Postgres WAL：物理複寫</text>
  <text x="44" y="134" font-size="13" fill="#141413">流上寫的是：「磁碟位址 8382491</text>
  <text x="44" y="154" font-size="13" fill="#141413">寫入位元組 XYZ」——備庫位元組級相同</text>
  <line x1="44" y1="168" x2="332" y2="168" stroke="#e8e6dc"/>
  <text x="44" y="190" font-size="13" fill="#141413">✕ 備庫無真 MVCC：長查詢擋 WAL 被殺</text>
  <text x="44" y="212" font-size="13" fill="#141413">✕ 壞位元組會跟著複寫污染整條鏈</text>
  <text x="44" y="234" font-size="13" fill="#141413">✕ 跨版本不能複寫：升級＝停機數小時</text>
  <text x="44" y="262" font-size="12" fill="#6b6a64">Uber 卡在 9.2：9.1→9.2 痛過一次，</text>
  <text x="44" y="280" font-size="12" fill="#6b6a64">9.3 出來時資料量已大到升不下去</text>

  <rect x="368" y="76" width="328" height="224" fill="#fff" stroke="#2e7d32" stroke-width="2" rx="8"/>
  <text x="388" y="106" font-size="15" font-weight="bold" fill="#2e7d32">MySQL binlog：邏輯複寫</text>
  <text x="388" y="134" font-size="13" fill="#141413">流上寫的是：「把 id=4 的 birth_year</text>
  <text x="388" y="154" font-size="13" fill="#141413">從 780 改成 770」——索引變化自推</text>
  <line x1="388" y1="168" x2="676" y2="168" stroke="#e8e6dc"/>
  <text x="388" y="190" font-size="13" fill="#141413">○ 備庫真 MVCC：讀查詢不擋複寫流</text>
  <text x="388" y="212" font-size="13" fill="#141413">○ B-tree 重平衡損壞不出複寫層</text>
  <text x="388" y="234" font-size="13" fill="#141413">○ 跨版本可複寫：一台台升、近零停機</text>
  <text x="388" y="262" font-size="12" fill="#6b6a64">代價：次級索引查詢要走兩次索引</text>
  <text x="388" y="280" font-size="12" fill="#6b6a64">（先找主鍵，再找行位址）</text>
</svg>
