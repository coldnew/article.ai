<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="760" height="360" rx="12" fill="#f8fafc"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">第一步：把圖抽象成問題（區間 → 重疊 → 建邊）</text>

  <!-- number line: 0..16 maps x 60..700 -->
  <line x1="60" y1="200" x2="700" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="60" y="220">0</text><text x="140" y="220">2</text><text x="220" y="220">4</text><text x="300" y="220">6</text><text x="380" y="220">8</text><text x="460" y="220">10</text><text x="540" y="220">12</text><text x="620" y="220">14</text><text x="700" y="220">16</text>
  </g>

  <!-- intervals: x = 60 + v*40 -->
  <rect x="100" y="70" width="160" height="26" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="88" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">A = [1, 5]</text>
  <rect x="220" y="108" width="160" height="26" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="300" y="126" font-size="13" font-weight="bold" fill="#5b21b6" text-anchor="middle">B = [4, 8]</text>
  <rect x="340" y="146" width="120" height="26" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="164" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">C = [7, 10]</text>
  <rect x="540" y="108" width="120" height="26" rx="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="126" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">D = [12, 15]</text>

  <!-- overlap markers -->
  <rect x="220" y="70" width="40" height="26" fill="#16a34a" opacity="0.25"/>
  <text x="240" y="60" font-size="11" fill="#166534" text-anchor="middle">A∩B</text>
  <rect x="340" y="108" width="40" height="26" fill="#16a34a" opacity="0.25"/>
  <text x="360" y="98" font-size="11" fill="#166534" text-anchor="middle">B∩C</text>

  <!-- resulting graph -->
  <text x="380" y="258" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">重疊就連邊：max(L1,L2) ≤ min(R1,R2)</text>
  <circle cx="230" cy="305" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="311" font-size="15" font-weight="bold" fill="#1e40af" text-anchor="middle">A</text>
  <circle cx="380" cy="305" r="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="311" font-size="15" font-weight="bold" fill="#5b21b6" text-anchor="middle">B</text>
  <circle cx="530" cy="305" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="530" y="311" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">C</text>
  <circle cx="660" cy="305" r="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="660" y="311" font-size="15" font-weight="bold" fill="#475569" text-anchor="middle">D</text>
  <line x1="252" y1="305" x2="358" y2="305" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="402" y1="305" x2="508" y2="305" stroke="#0f172a" stroke-width="2.5"/>
  <text x="595" y="310" font-size="12" fill="#94a3b8" text-anchor="middle">D 孤立</text>
</svg>
