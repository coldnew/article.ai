<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="380" rx="12" fill="#f8fafc"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">第二步：思路鏈——先寫對，再談快</text>

  <!-- chain row 1 -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="20" y="55" width="100" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="70" y="82" fill="#1e40af">Interval</text>
    <rect x="140" y="55" width="110" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="195" y="82" fill="#1e40af">Overlap 檢測</text>
    <rect x="270" y="55" width="90" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="315" y="82" fill="#1e40af">Graph</text>
    <rect x="380" y="55" width="100" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="430" y="82" fill="#92400e">Brute Force</text>
    <rect x="500" y="55" width="110" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="555" y="82" fill="#991b1b">找到瓶頸</text>
    <rect x="630" y="55" width="110" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="685" y="82" fill="#166534">Range Query</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="120" y1="77" x2="138" y2="77" marker-end="url(#arr2)"/>
    <line x1="250" y1="77" x2="268" y2="77" marker-end="url(#arr2)"/>
    <line x1="360" y1="77" x2="378" y2="77" marker-end="url(#arr2)"/>
    <line x1="480" y1="77" x2="498" y2="77" marker-end="url(#arr2)"/>
    <line x1="610" y1="77" x2="628" y2="77" marker-end="url(#arr2)"/>
  </g>

  <!-- complexity box -->
  <rect x="20" y="115" width="720" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="140" font-size="13" fill="#0f172a"><tspan font-weight="bold">暴力解複雜度：</tspan>兩兩比較建邊 O(N²)，BFS／DFS 走訪 O(N+E)</text>
  <text x="40" y="163" font-size="13" fill="#0f172a">N 一大 O(N²) 頂不住 → 真問題變成：<tspan font-weight="bold">給定一區間，快速找出所有與之重疊者</tspan></text>
  <text x="40" y="180" font-size="12" fill="#475569">此時才輪到 Sweep Line、Interval Tree、Segment Tree 上場（資料結構是答案，不是起點）</text>

  <!-- google order -->
  <text x="380" y="212" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Google 的考察順序（不能跳步）</text>
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="225" width="128" height="52" rx="8" fill="#16a34a"/>
    <text x="84" y="246" fill="#ffffff" font-weight="bold">1 理解題目</text>
    <text x="84" y="263" fill="#dcfce7">圖 → 自己悟題意</text>
    <rect x="164" y="225" width="128" height="52" rx="8" fill="#16a34a"/>
    <text x="228" y="246" fill="#ffffff" font-weight="bold">2 給出正確解</text>
    <text x="228" y="263" fill="#dcfce7">先寫 Brute Force</text>
    <rect x="308" y="225" width="128" height="52" rx="8" fill="#16a34a"/>
    <text x="372" y="246" fill="#ffffff" font-weight="bold">3 說清楚為何慢</text>
    <text x="372" y="263" fill="#dcfce7">指名 O(N²) 瓶頸</text>
    <rect x="452" y="225" width="128" height="52" rx="8" fill="#16a34a"/>
    <text x="516" y="246" fill="#ffffff" font-weight="bold">4 找到瓶頸</text>
    <text x="516" y="263" fill="#dcfce7">化約為 Range Query</text>
    <rect x="596" y="225" width="144" height="52" rx="8" fill="#16a34a"/>
    <text x="668" y="246" fill="#ffffff" font-weight="bold">5 一步步優化</text>
    <text x="668" y="263" fill="#dcfce7">再請資料結構上場</text>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <line x1="148" y1="251" x2="162" y2="251"/>
    <line x1="292" y1="251" x2="306" y2="251"/>
    <line x1="436" y1="251" x2="450" y2="251"/>
    <line x1="580" y1="251" x2="594" y2="251"/>
  </g>

  <!-- takeaway -->
  <rect x="20" y="292" width="720" height="68" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="380" y="316" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">上來就秀 Segment Tree、沒先寫暴力解＝負面反饋：別急著證明自己會資料結構</text>
  <text x="380" y="338" font-size="12" fill="#991b1b" text-anchor="middle">值得練的能力：陌生圖 → 抽象成問題；見 Interval 想 Graph；見 O(N²) 找瓶頸；見 Range Query 才想結構</text>
</svg>
