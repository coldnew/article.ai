<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="system-ui, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="760" height="330" rx="12" fill="#faf9f5"/>
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#141413">同一隻果蠅，三種用法：科學、藝術、變現</text>
  <g font-size="13" fill="#141413">
    <rect x="24" y="56" width="222" height="200" rx="8" fill="#ffffff" stroke="#1b365d" stroke-width="2"/>
    <text x="40" y="88" font-size="15" font-weight="bold" fill="#1b365d">① 科學硬核</text>
    <text x="40" y="114">Eon 上傳（3 月）</text>
    <text x="40" y="136">MaleCNS 全圖譜（9/3）</text>
    <text x="40" y="158">desktop-fly 開源</text>
    <text x="40" y="184" fill="#6b6a64">可驗證、有方法、</text>
    <text x="40" y="206" fill="#6b6a64">承認邊界（無可塑性、</text>
    <text x="40" y="228" fill="#6b6a64">權重為突觸數代理）</text>
    <rect x="269" y="56" width="222" height="200" rx="8" fill="#ffffff" stroke="#8a5a2b" stroke-width="2"/>
    <text x="285" y="88" font-size="15" font-weight="bold" fill="#8a5a2b">② 行為藝術</text>
    <text x="285" y="114">Bad Apple（19.5M）</text>
    <text x="285" y="136">Minecraft（GPT-6 接線）</text>
    <text x="285" y="158">Beat Saber（16.7M）</text>
    <text x="285" y="184" fill="#6b6a64">作者自承 kind of fake／</text>
    <text x="285" y="206" fill="#6b6a64">overfit／V1 開發中；</text>
    <text x="285" y="228" fill="#6b6a64">流量大、驗證少</text>
    <rect x="514" y="56" width="222" height="200" rx="8" fill="#ffffff" stroke="#b3352b" stroke-width="2"/>
    <text x="530" y="88" font-size="15" font-weight="bold" fill="#b3352b">③ 熱點變現</text>
    <text x="530" y="114">發幣文（CA＋交易所鏈）</text>
    <text x="530" y="136">創世紀文（32K 傳播）</text>
    <text x="530" y="158">賽博永生提問（4.8K）</text>
    <text x="530" y="184" fill="#6b6a64">回覆「又 rug 了」；</text>
    <text x="530" y="206" fill="#6b6a64">停權號歸屬錯誤；</text>
    <text x="530" y="228" fill="#6b6a64">把展望當現狀賣</text>
  </g>
  <text x="24" y="288" font-size="12" fill="#6b6a64">讀法：轉貼前先問這是第幾層。① 看方法與數據，② 看作者自己的澄清，③ 看有沒有收錢（幣、課、流量）。</text>
  <text x="24" y="308" font-size="12" fill="#6b6a64">本站自繪；觀看數為發稿時頁面顯示。</text>
</svg>
