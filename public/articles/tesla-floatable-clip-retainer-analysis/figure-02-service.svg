<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">雙槽分工：插入用一槽、維修用另一槽</text>

  <!-- LEFT: insertion -->
  <text x="200" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">裝配：第六壁槽插入</text>
  <rect x="110" y="90" width="180" height="40" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="115" text-anchor="middle" font-size="14" fill="#14532d">飾板＋tower＋夾子</text>
  <line x1="200" y1="132" x2="200" y2="168" stroke="#16a34a" stroke-width="3"/>
  <polygon points="200,182 192,168 208,168" fill="#16a34a"/>
  <rect x="120" y="184" width="160" height="150" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="200" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">中空本體</text>
  <!-- windows -->
  <rect x="120" y="240" width="18" height="44" fill="#f8fafc" stroke="#ea580c" stroke-width="2"/>
  <rect x="262" y="240" width="18" height="44" fill="#f8fafc" stroke="#ea580c" stroke-width="2"/>
  <text x="200" y="262" text-anchor="middle" font-size="13" fill="#9a3412">雙臂彈入側窗</text>
  <text x="200" y="312" text-anchor="middle" font-size="13" fill="#9a3412">錐形導引面 1002</text>
  <text x="200" y="368" text-anchor="middle" font-size="14" fill="#475569">插入時雙臂內縮、到位回彈</text>

  <!-- RIGHT: service -->
  <text x="600" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">維修：第五壁槽伸工具退出</text>
  <rect x="510" y="184" width="180" height="150" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="600" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">同一中空本體</text>
  <rect x="510" y="240" width="18" height="44" fill="#f8fafc" stroke="#ea580c" stroke-width="2"/>
  <rect x="672" y="240" width="18" height="44" fill="#f8fafc" stroke="#ea580c" stroke-width="2"/>
  <!-- tool -->
  <rect x="592" y="120" width="16" height="150" rx="4" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/>
  <text x="660" y="140" font-size="14" fill="#5b21b6">薄型</text>
  <text x="660" y="160" font-size="14" fill="#5b21b6">釋放工具</text>
  <line x1="584" y1="150" x2="560" y2="200" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="300" text-anchor="middle" font-size="13" fill="#5b21b6">工具內壓彈簧臂→脫窗</text>
  <text x="600" y="368" text-anchor="middle" font-size="14" fill="#475569">飾板平滑拔出、不折塑膠</text>

  <!-- divider -->
  <line x1="400" y1="60" x2="400" y2="380" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- bottom note -->
  <rect x="60" y="400" width="680" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="428" font-size="14" fill="#334155">本站自繪示意（非專利原圖）：傳統硬式卡扣維修硬拔常斷裂、回裝變鬆；此設計把「扣住」與「放開」做成兩個獨立開口。</text>
  <text x="80" y="451" font-size="14" fill="#334155">重複拆裝不損保持力 → 出廠貼合度在維修後仍可維持，對應專利 FIG.10–11 與內文工具釋放段。</text>
</svg>
