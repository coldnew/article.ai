<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="system-ui, -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <rect x="0" y="0" width="800" height="470" rx="12" fill="#f8fafc"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#0f172a">四組 12 週瘦組織變化（kg，相對基準線）</text>
  <text x="30" y="58" font-size="13" fill="#64748b">淺色＝第 6 週　深色＝第 12 週　｜　灰＝安慰劑（麥芽糊精）　綠＝肌酸（每日 2 × 5 g）</text>

  <!-- zero line -->
  <line x1="260" y1="86" x2="260" y2="386" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="260" y="400" font-size="12" fill="#64748b" text-anchor="middle">0</text>

  <!-- Group 1: NoEx+PLA n=13 -->
  <text x="20" y="112" font-size="14" font-weight="700" fill="#334155">不練 ＋ 安慰劑</text>
  <text x="20" y="130" font-size="12" fill="#64748b">n = 13</text>
  <rect x="245" y="100" width="15" height="18" rx="3" fill="#cbd5e1"/>
  <text x="238" y="114" font-size="12" fill="#64748b" text-anchor="end">−0.09</text>
  <rect x="233" y="122" width="27" height="18" rx="3" fill="#64748b"/>
  <text x="226" y="136" font-size="12" fill="#64748b" text-anchor="end">−0.16</text>

  <!-- Group 2: NoEx+CrM n=13 -->
  <text x="20" y="192" font-size="14" font-weight="700" fill="#334155">不練 ＋ 肌酸</text>
  <text x="20" y="210" font-size="12" fill="#64748b">n = 13</text>
  <rect x="260" y="180" width="165" height="18" rx="3" fill="#a7f3d0"/>
  <text x="431" y="194" font-size="12" font-weight="700" fill="#047857">+0.99</text>
  <rect x="260" y="202" width="183" height="18" rx="3" fill="#10b981"/>
  <text x="449" y="216" font-size="12" font-weight="700" fill="#047857">+1.10（≈2.43 lbs）</text>

  <!-- Group 3: Ex+PLA n=18 -->
  <text x="20" y="272" font-size="14" font-weight="700" fill="#334155">練＋飲食 ＋ 安慰劑</text>
  <text x="20" y="290" font-size="12" fill="#64748b">n = 18</text>
  <rect x="242" y="260" width="18" height="18" rx="3" fill="#cbd5e1"/>
  <text x="235" y="274" font-size="12" fill="#64748b" text-anchor="end">−0.11</text>
  <rect x="260" y="282" width="23" height="18" rx="3" fill="#64748b"/>
  <text x="289" y="296" font-size="12" fill="#475569">+0.14（≈0.31 lbs）</text>

  <!-- Group 4: Ex+CrM n=20 -->
  <text x="20" y="352" font-size="14" font-weight="700" fill="#334155">練＋飲食 ＋ 肌酸</text>
  <text x="20" y="370" font-size="12" fill="#64748b">n = 20</text>
  <rect x="260" y="340" width="282" height="18" rx="3" fill="#a7f3d0"/>
  <text x="548" y="354" font-size="12" font-weight="700" fill="#047857">+1.69</text>
  <rect x="260" y="362" width="212" height="18" rx="3" fill="#10b981"/>
  <text x="478" y="376" font-size="12" font-weight="700" fill="#047857">+1.27</text>

  <text x="30" y="420" font-size="12" fill="#64748b">數據：Chun et al., JISSN 2026（PMC13463452）Discussion 原文，週 6 ／週 12 均值。</text>
  <text x="30" y="440" font-size="12" fill="#b45309">提醒：DXA 把肌肉內水分計為瘦組織，肌酸會把水拉進肌細胞——部分增量可能是水，不是新肌肉（貼文第 15 則作者自述）。</text>
</svg>
