<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="system-ui, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#faf9f5"/>
  <text x="30" y="34" font-size="17" font-weight="bold" fill="#141413">Helix：不許一次寫對，只能一關一關過</text>
  <text x="30" y="58" font-size="12.5" fill="#6b6a64">one-shot 重寫會產生不可維護的程式碼；Helix 讓不完美的嘗試無法前進，直到變好為止</text>
  <g font-size="13">
    <rect x="30" y="80" width="130" height="60" rx="8" fill="#1b365d"/>
    <text x="95" y="105" fill="#fff" text-anchor="middle">指著一個</text>
    <text x="95" y="125" fill="#fff" text-anchor="middle">畫面</text>
    <text x="172" y="115" font-size="18" fill="#8a5a2b">→</text>
    <rect x="190" y="80" width="150" height="60" rx="8" fill="#fff" stroke="#1b365d"/>
    <text x="265" y="105" fill="#141413" text-anchor="middle">切成 checkpoints</text>
    <text x="265" y="125" font-size="11.5" fill="#6b6a64" text-anchor="middle">幾分鐘可審的小片</text>
    <text x="352" y="115" font-size="18" fill="#8a5a2b">→</text>
    <rect x="370" y="80" width="150" height="60" rx="8" fill="#fff" stroke="#1b365d"/>
    <text x="445" y="105" fill="#141413" text-anchor="middle">逐片建造</text>
    <text x="445" y="125" font-size="11.5" fill="#6b6a64" text-anchor="middle">一次只做一片</text>
    <text x="532" y="115" font-size="18" fill="#8a5a2b">→</text>
    <rect x="550" y="80" width="180" height="60" rx="8" fill="#2e7d4f"/>
    <text x="640" y="105" fill="#fff" text-anchor="middle">四道門全過才 commit</text>
    <text x="640" y="125" font-size="11.5" fill="#e8e6dc" text-anchor="middle">再做下一片</text>
  </g>
  <text x="30" y="175" font-size="14" font-weight="bold" fill="#141413">每片必過的四道門</text>
  <g font-size="12.5">
    <rect x="30" y="190" width="160" height="56" rx="8" fill="#fff" stroke="#e8e6dc"/>
    <text x="110" y="213" fill="#141413" text-anchor="middle">① 測試證明行為</text>
    <text x="110" y="233" font-size="11" fill="#6b6a64" text-anchor="middle">tests prove behavior</text>
    <rect x="205" y="190" width="160" height="56" rx="8" fill="#fff" stroke="#e8e6dc"/>
    <text x="285" y="213" fill="#141413" text-anchor="middle">② 視覺對齊運行中 App</text>
    <text x="285" y="233" font-size="11" fill="#6b6a64" text-anchor="middle">visual review</text>
    <rect x="380" y="190" width="160" height="56" rx="8" fill="#fff" stroke="#e8e6dc"/>
    <text x="460" y="213" fill="#141413" text-anchor="middle">③ 兩個對抗式審查員</text>
    <text x="460" y="233" font-size="11" fill="#6b6a64" text-anchor="middle">adversarial reviewers</text>
    <rect x="555" y="190" width="175" height="56" rx="8" fill="#fff" stroke="#e8e6dc"/>
    <text x="642" y="213" fill="#141413" text-anchor="middle">④ 人類點頭</text>
    <text x="642" y="233" font-size="11" fill="#6b6a64" text-anchor="middle">human nod</text>
  </g>
  <text x="30" y="280" font-size="14" font-weight="bold" fill="#141413">配套：讓 Agent 能測的架構</text>
  <text x="30" y="304" font-size="12.5" fill="#6b6a64">商業邏輯與 UI 完全解耦、可在桌機無頭運行，Agent 經 CLI 以毫秒級迭代（不用抱模擬器）；</text>
  <text x="30" y="326" font-size="12.5" fill="#6b6a64">每次 review 的回饋都被記住，迴圈越跑越自主。另：一次到位的誘惑就是 slop 的來源。</text>
  <text x="30" y="358" font-size="11.5" fill="#6b6a64">本站自繪：依官方部落格 Helix 章節重組，原 GIF 不轉載。</text>
</svg>
