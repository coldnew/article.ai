<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui,sans-serif">
<text x="20" y="28" font-size="16" font-weight="bold">Agent-Centric（左） vs Substrate-Centric / ScaleMAS（右）</text>
<rect x="20" y="45" width="320" height="270" rx="10" fill="none" stroke="#c00" stroke-width="2"/>
<text x="35" y="70" font-size="13" font-weight="bold" fill="#c00">Agent 直接對話：讀負擔 O(N)</text>
<circle cx="90" cy="130" r="22" fill="#f8d7da" stroke="#c00"/><text x="78" y="135" font-size="12">A0</text>
<circle cx="180" cy="110" r="22" fill="#f8d7da" stroke="#c00"/><text x="168" y="115" font-size="12">A1</text>
<circle cx="270" cy="130" r="22" fill="#f8d7da" stroke="#c00"/><text x="258" y="135" font-size="12">A2</text>
<circle cx="135" cy="210" r="22" fill="#f8d7da" stroke="#c00"/><text x="123" y="215" font-size="12">A3</text>
<circle cx="225" cy="210" r="22" fill="#f8d7da" stroke="#c00"/><text x="213" y="215" font-size="12">A4</text>
<g stroke="#c00" stroke-width="1"><line x1="110" y1="122" x2="160" y2="114"/><line x1="200" y1="118" x2="250" y2="126"/><line x1="100" y1="150" x2="125" y2="190"/><line x1="165" y1="200" x2="205" y2="208"/><line x1="155" y1="205" x2="248" y2="140"/><line x1="198" y1="122" x2="148" y2="192"/></g>
<text x="35" y="265" font-size="12">全員廣播 → 每人讀全部輸出</text>
<text x="35" y="285" font-size="12">MAD 16 agent 達 48.5M tokens，準確率原地踏步</text>
<rect x="380" y="45" width="320" height="270" rx="10" fill="none" stroke="#0a0" stroke-width="2"/>
<text x="395" y="70" font-size="13" font-weight="bold" fill="#0a0">只與介質打交道：每次讀 ≤ k 條</text>
<rect x="470" y="95" width="140" height="60" rx="8" fill="#d4edda" stroke="#0a0"/>
<text x="485" y="118" font-size="12">共享 Datastore</text>
<text x="490" y="136" font-size="11">publish / search / visit</text>
<circle cx="430" cy="210" r="20" fill="#d4edda" stroke="#0a0"/><text x="420" y="214" font-size="11">A0</text>
<circle cx="540" cy="210" r="20" fill="#d4edda" stroke="#0a0"/><text x="530" y="214" font-size="11">A1</text>
<circle cx="650" cy="210" r="20" fill="#d4edda" stroke="#0a0"/><text x="640" y="214" font-size="11">A2</text>
<g stroke="#0a0" stroke-width="1.5"><line x1="440" y1="192" x2="480" y2="155"/><line x1="540" y1="190" x2="540" y2="155"/><line x1="640" y1="192" x2="600" y2="155"/></g>
<text x="395" y="265" font-size="12">引用加權排序（BM25 ＋ 被引次數）</text>
<text x="395" y="285" font-size="12">零引用灌水沉底；作者隱藏，只看內容與連結</text>
</svg>
