<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#f8fafc"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">Grid、Block、Thread、Warp：四層組織與索引公式</text>
  <text x="40" y="70" font-size="14" fill="#64748b">依《How do CUDA Kernels Work?》重繪：一次 kernel 啟動＝1 個 Grid＝3907 個 Blocks</text>

  <!-- Grid panel -->
  <rect x="40" y="95" width="330" height="380" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="60" y="128" font-size="17" font-weight="700" fill="#0369a1">Grid（整間廚房）</text>
  <text x="60" y="150" font-size="13" fill="#64748b">3907 個 blocks（此處示意 6 個）</text>
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="60" y="165" width="90" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="105" y="186" fill="#075985">Block 0</text><text x="105" y="205" font-size="11" fill="#64748b" font-weight="400">桌 0</text>
    <rect x="160" y="165" width="90" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="205" y="186" fill="#075985">Block 1</text><text x="205" y="205" font-size="11" fill="#64748b" font-weight="400">桌 1</text>
    <rect x="260" y="165" width="90" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="305" y="186" fill="#92400e">Block 2</text><text x="305" y="205" font-size="11" fill="#92400e" font-weight="400">★ 放大看</text>
    <rect x="60" y="227" width="90" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="105" y="252" fill="#075985">Block 3</text>
    <rect x="160" y="227" width="90" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="205" y="252" fill="#64748b">…</text>
    <rect x="260" y="227" width="90" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="305" y="248" fill="#075985">Block 3906</text><text x="305" y="267" font-size="11" fill="#64748b" font-weight="400">末桌</text>
  </g>
  <text x="60" y="320" font-size="13" fill="#334155">每個 block 上限 1024 threads，</text>
  <text x="60" y="340" font-size="13" fill="#334155">本例每 block 256 threads。</text>
  <rect x="60" y="360" width="290" height="95" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="74" y="386" font-size="13" font-weight="700" fill="#15803d">驗算（經執行確認）</text>
  <text x="74" y="410" font-size="13" fill="#334155">3907 × 256 ＝ 1,000,192 threads</text>
  <text x="74" y="432" font-size="13" fill="#334155">比一百萬多 192 個，由 if (i &lt; n) 擋下</text>

  <!-- arrow -->
  <line x1="385" y1="285" x2="425" y2="285" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Block detail panel -->
  <rect x="440" y="95" width="400" height="380" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="460" y="128" font-size="17" font-weight="700" fill="#92400e">Block 2（2 號桌：256 個座位）</text>
  <text x="460" y="150" font-size="13" fill="#64748b">每 32 個一排＝1 個 warp，共 8 排</text>
  <g>
    <!-- 8 rows x 32 cols of seats; highlight col 10 of row 0 -->
    <g fill="#fde68a" stroke="#d97706" stroke-width="0.8">
      <rect x="468" y="165" width="10" height="10"/><rect x="480" y="165" width="10" height="10"/><rect x="492" y="165" width="10" height="10"/><rect x="504" y="165" width="10" height="10"/><rect x="516" y="165" width="10" height="10"/><rect x="528" y="165" width="10" height="10"/><rect x="540" y="165" width="10" height="10"/><rect x="552" y="165" width="10" height="10"/><rect x="564" y="165" width="10" height="10"/><rect x="576" y="165" width="10" height="10"/>
      <rect x="588" y="165" width="10" height="10" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
      <rect x="602" y="165" width="10" height="10"/><rect x="614" y="165" width="10" height="10"/><rect x="626" y="165" width="10" height="10"/><rect x="638" y="165" width="10" height="10"/><rect x="650" y="165" width="10" height="10"/><rect x="662" y="165" width="10" height="10"/><rect x="674" y="165" width="10" height="10"/><rect x="686" y="165" width="10" height="10"/><rect x="698" y="165" width="10" height="10"/><rect x="710" y="165" width="10" height="10"/><rect x="722" y="165" width="10" height="10"/><rect x="734" y="165" width="10" height="10"/><rect x="746" y="165" width="10" height="10"/><rect x="758" y="165" width="10" height="10"/><rect x="770" y="165" width="10" height="10"/><rect x="782" y="165" width="10" height="10"/><rect x="794" y="165" width="10" height="10"/><rect x="806" y="165" width="10" height="10"/><rect x="818" y="165" width="10" height="10"/><rect x="830" y="165" width="10" height="10"/><rect x="842" y="165" width="10" height="10"/>
    </g>
    <g fill="#fef3c7" stroke="#d97706" stroke-width="0.8">
      <g id="rows">
      </g>
      <rect x="468" y="185" width="374" height="12"/><rect x="468" y="203" width="374" height="12"/><rect x="468" y="221" width="374" height="12"/><rect x="468" y="239" width="374" height="12"/><rect x="468" y="257" width="374" height="12"/><rect x="468" y="275" width="374" height="12"/><rect x="468" y="293" width="374" height="12"/>
    </g>
  </g>
  <text x="858" y="176" font-size="12" fill="#475569">← warp 0</text>
  <text x="858" y="196" font-size="12" fill="#475569">← warp 1…7</text>
  <text x="460" y="330" font-size="13" fill="#334155">紅色座位＝Block 2 的 Thread 10（10 號座）。</text>
  <text x="460" y="352" font-size="13" fill="#334155">warp 內 32 threads 同一時刻執行同一道指令。</text>
  <rect x="460" y="368" width="360" height="87" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="474" y="394" font-size="13" font-weight="700" fill="#b91c1c">warp divergence 示警</text>
  <text x="474" y="416" font-size="13" fill="#334155">同 warp 有人走 if 有人走 else 時，</text>
  <text x="474" y="436" font-size="13" fill="#334155">兩條路輪流跑，平行優勢被吃掉。</text>

  <!-- arrow -->
  <line x1="855" y1="285" x2="895" y2="285" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Formula panel -->
  <rect x="910" y="95" width="250" height="380" rx="12" fill="#0f172a"/>
  <text x="930" y="128" font-size="16" font-weight="700" fill="#e2e8f0">索引公式</text>
  <text x="930" y="160" font-size="13" fill="#93c5fd">i ＝ 桌號 × 每桌人數</text>
  <text x="930" y="180" font-size="13" fill="#93c5fd">＋ 座號</text>
  <text x="930" y="208" font-size="12" fill="#64748b">blockIdx.x × blockDim.x</text>
  <text x="930" y="226" font-size="12" fill="#64748b">＋ threadIdx.x</text>
  <line x1="930" y1="242" x2="1140" y2="242" stroke="#334155"/>
  <text x="930" y="270" font-size="13" font-weight="700" fill="#fbbf24">2 × 256 ＋ 10</text>
  <text x="930" y="296" font-size="20" font-weight="700" fill="#22c55e">＝ 522</text>
  <text x="930" y="322" font-size="12" fill="#94a3b8">2 號桌 10 號座位的幫手，</text>
  <text x="930" y="340" font-size="12" fill="#94a3b8">自己算出 522，去拿</text>
  <text x="930" y="358" font-size="12" fill="#94a3b8">522 號馬鈴薯，不必問人。</text>
  <text x="930" y="392" font-size="12" fill="#64748b">Block 0 Thread 5 → 5</text>
  <text x="930" y="412" font-size="12" fill="#64748b">Block 1 Thread 0 → 256</text>
  <text x="930" y="432" font-size="12" fill="#64748b">皆經執行驗算成立。</text>

  <text x="40" y="520" font-size="13" fill="#475569">末 block 加碼驗算：有效 threads 為 64 ＝ 2 個滿編 warp，6 個全空 warp——連一點 divergence 都沒有，比原文說的還乾淨。</text>
  <text x="40" y="548" font-size="12" fill="#94a3b8">自繪圖。數字來源：《How do CUDA Kernels Work?》（Outcome School）；算式經本機 python3 -c 執行驗算。</text>
</svg>
