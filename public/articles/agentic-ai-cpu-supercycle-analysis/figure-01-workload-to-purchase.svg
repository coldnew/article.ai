<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="360" rx="12" fill="#f8fafc"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">工作量如何變成採購：3 倍任務 ÷ 效率 × 利用率 ＝ 1.67 倍容量</text>

  <!-- step 1 -->
  <rect x="20" y="50" width="170" height="220" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="74" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">起點：Muse 實例</text>
  <text x="105" y="100" font-size="11" fill="#334155" text-anchor="middle">每用戶一台 Linux 雲 VM</text>
  <text x="105" y="117" font-size="11" fill="#334155" text-anchor="middle">開瀏覽器＋跑程式</text>
  <text x="105" y="134" font-size="11" fill="#334155" text-anchor="middle">關 App 後繼續跑</text>
  <rect x="36" y="150" width="138" height="40" rx="6" fill="#dbeafe"/>
  <text x="105" y="167" font-size="11" fill="#1e40af" text-anchor="middle">偶爾一次 → 每天持續</text>
  <text x="105" y="183" font-size="11" fill="#1e40af" text-anchor="middle">新增 CPU 執行時間</text>
  <text x="105" y="216" font-size="11" fill="#64748b" text-anchor="middle">Meta 官方 2026-09-08</text>
  <text x="105" y="233" font-size="11" fill="#64748b" text-anchor="middle">第三方實測 2 vCPU</text>
  <text x="105" y="250" font-size="11" fill="#64748b" text-anchor="middle">AMD EPYC 9D25 切片</text>

  <line x1="198" y1="160" x2="222" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 2 math -->
  <rect x="230" y="50" width="280" height="220" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
  <text x="370" y="74" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">情境算例（本站已複算 ✓）</text>
  <text x="370" y="102" font-size="13" fill="#fbbf24" text-anchor="middle">3 ÷（1.5 × 1.2）＝ 1.67</text>
  <text x="370" y="128" font-size="11" fill="#e2e8f0" text-anchor="middle">任務量 ×3，單核效率 ＋50%</text>
  <text x="370" y="145" font-size="11" fill="#e2e8f0" text-anchor="middle">利用率 ＋20%（等待時做別的事）</text>
  <text x="370" y="170" font-size="11" fill="#e2e8f0" text-anchor="middle">VM 共享底層 CPU＋按實際消耗計費</text>
  <text x="370" y="187" font-size="11" fill="#e2e8f0" text-anchor="middle">（AWS AgentCore 模式）</text>
  <rect x="250" y="202" width="240" height="40" rx="6" fill="#ffffff"/>
  <text x="370" y="219" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">擴容觸發線：任務增長</text>
  <text x="370" y="235" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">持續超過優化＋閒置容量</text>

  <line x1="518" y1="160" x2="542" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 3 -->
  <rect x="550" y="50" width="190" height="220" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="74" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">終點：向誰買</text>
  <text x="645" y="100" font-size="11" fill="#334155" text-anchor="middle">租雲 → 雲平台擴機型</text>
  <text x="645" y="117" font-size="11" fill="#334155" text-anchor="middle">自建 → 供應鏈下單</text>
  <text x="645" y="134" font-size="11" fill="#334155" text-anchor="middle">終端 → 裝置換機潮</text>
  <rect x="566" y="150" width="158" height="40" rx="6" fill="#dcfce7"/>
  <text x="645" y="167" font-size="11" fill="#166534" text-anchor="middle">Intel／AMD 看處理器</text>
  <text x="645" y="183" font-size="11" fill="#166534" text-anchor="middle">Arm 拆 IP 與自有 CPU</text>
  <text x="645" y="216" font-size="11" fill="#64748b" text-anchor="middle">Muse 專屬配置未公開</text>
  <text x="645" y="233" font-size="11" fill="#64748b" text-anchor="middle">分配比例待追蹤交付</text>
  <text x="645" y="256" font-size="11" fill="#b45309" text-anchor="middle">問題從算力變採購 ✓</text>

  <text x="380" y="308" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">作者誠實處：1.67 倍與 128 項自標假設，虛線實線分開畫</text>
  <text x="380" y="330" font-size="11" fill="#475569" text-anchor="middle">超級周期成立只在觸發線被持續踩過之後，在此之前一切都是情境——作者自己寫了「不負責任預測」</text>
</svg>
