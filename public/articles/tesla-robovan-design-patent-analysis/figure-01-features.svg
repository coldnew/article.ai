<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="720" height="340" rx="12" fill="#f5f8fa"/>
  <text x="24" y="32" font-size="16" font-weight="700" fill="#0f1419">Robovan 外觀四特徵（依 US D1138869 S 圖式重繪）</text>
  <g>
    <rect x="60" y="120" width="600" height="110" rx="55" fill="#e8eef2" stroke="#0f1419" stroke-width="2"/>
    <rect x="120" y="132" width="480" height="34" rx="17" fill="#1c3a52"/>
    <text x="360" y="155" font-size="13" fill="#ffffff" text-anchor="middle">環繞玻璃帶（glass beltway）</text>
    <line x1="60" y1="188" x2="660" y2="188" stroke="#b8892e" stroke-width="3"/>
    <line x1="60" y1="196" x2="660" y2="196" stroke="#b8892e" stroke-width="2"/>
    <text x="360" y="212" font-size="12" fill="#5b6570" text-anchor="middle">水平裝飾線（horizontal accent lines）</text>
    <rect x="150" y="176" width="120" height="54" rx="10" fill="#ffffff" stroke="#0f1419" stroke-width="1.5"/>
    <text x="210" y="200" font-size="12" fill="#0f1419" text-anchor="middle">滑門開口</text>
    <text x="210" y="216" font-size="11" fill="#5b6570" text-anchor="middle">FIG.3 側視可見</text>
    <ellipse cx="180" cy="230" rx="26" ry="10" fill="#ffffff" stroke="#0f1419" stroke-width="1.5" stroke-dasharray="4 3"/>
    <ellipse cx="540" cy="230" rx="26" ry="10" fill="#ffffff" stroke="#0f1419" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="360" y="262" font-size="12" fill="#0f1419" text-anchor="middle">輪艙完全包覆（虛線＝圖中輪廓，車輪藏於裙擺內）</text>
    <text x="360" y="282" font-size="12" fill="#5b6570" text-anchor="middle">無水箱罩、無引擎蓋、無後視鏡、無駕駛艙＝對稱無臉（faceless）膠囊體</text>
  </g>
  <text x="24" y="318" font-size="11" fill="#5b6570">本站自繪，對照專利 FIG.1–FIG.3、FIG.7、FIG.24；裝飾線數量與玻璃範圍以專利圖為準。</text>
</svg>
