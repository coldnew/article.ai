<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Noto Sans TC, sans-serif">
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b365d">同一個蘋果，兩種問題</text>
  <g>
    <rect x="40" y="50" width="250" height="220" rx="10" fill="#faf9f5" stroke="#e8e6dc"/>
    <text x="165" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b6a64">農業專家回答得了</text>
    <circle cx="165" cy="130" r="34" fill="#c0392b"/>
    <path d="M165 100 q6 -14 18 -16" stroke="#5a7a3a" stroke-width="4" fill="none"/>
    <ellipse cx="180" cy="88" rx="12" ry="6" fill="#5a7a3a" transform="rotate(-20 180 88)"/>
    <text x="165" y="188" text-anchor="middle" font-size="13" fill="#141413">什麼品種？</text>
    <text x="165" y="210" text-anchor="middle" font-size="13" fill="#141413">多少營養？從哪裡來？</text>
    <text x="165" y="248" text-anchor="middle" font-size="13" fill="#6b6a64">← 物理屬性，看得見</text>
  </g>
  <g>
    <rect x="350" y="50" width="250" height="220" rx="10" fill="#1b365d"/>
    <text x="475" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#f5f4ed">市場經濟還要多問一句</text>
    <circle cx="475" cy="130" r="34" fill="#c0392b"/>
    <path d="M475 100 q6 -14 18 -16" stroke="#8aa86a" stroke-width="4" fill="none"/>
    <text x="475" y="128" text-anchor="middle" font-size="30" font-weight="bold" fill="#f5f4ed">？</text>
    <text x="475" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#f5f4ed">這個蘋果是誰的？</text>
    <text x="475" y="212" text-anchor="middle" font-size="13" fill="#f5f4ed">蘋果上沒寫名字</text>
    <text x="475" y="248" text-anchor="middle" font-size="13" fill="#e8e6dc">歸屬 → 需要制度回答 →</text>
  </g>
</svg>
