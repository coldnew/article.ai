<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <rect x="0" y="0" width="720" height="400" rx="12" fill="#f5f8fa"/>
  <text x="24" y="32" font-size="16" font-weight="700" fill="#0f1419">固定一把尺 vs 每個 token 一把尺（依 US 2026/0299881 A1 [0079] 重繪）</text>
  <text x="24" y="52" font-size="11" fill="#5b6570">INT8 只有 256 格刻度；動態量化為每個 token 算一個 scale（每列一個，存暫存器），最大值落在最後一格</text>
  <text x="24" y="84" font-size="13" font-weight="700" fill="#5b6570">固定尺（static）：小值全擠在同一格</text>
  <g stroke="#9aa5b1" stroke-width="2">
    <line x1="40" y1="140" x2="330" y2="140"/>
    <line x1="40" y1="200" x2="330" y2="200"/>
    <line x1="40" y1="260" x2="330" y2="260"/>
  </g>
  <g fill="#9aa5b1">
    <circle cx="60" cy="128" r="5"/><circle cx="60" cy="116" r="5"/><circle cx="60" cy="104" r="5"/><circle cx="60" cy="92" r="5"/>
    <circle cx="120" cy="188" r="5"/><circle cx="170" cy="188" r="5"/><circle cx="190" cy="188" r="5"/><circle cx="240" cy="188" r="5"/><circle cx="262" cy="188" r="5"/>
    <circle cx="60" cy="248" r="5"/><circle cx="140" cy="248" r="5"/><circle cx="220" cy="248" r="5"/><circle cx="300" cy="248" r="5"/>
  </g>
  <g fill="#5b6570" font-size="12">
    <text x="24" y="144">T1</text><text x="24" y="204">T2</text><text x="24" y="264">T3</text>
  </g>
  <text x="375" y="84" font-size="13" font-weight="700" fill="#c2410c">每 token 一把尺（per-token）：每列鋪滿 256 格</text>
  <g stroke="#c2410c" stroke-width="2">
    <line x1="400" y1="140" x2="690" y2="140"/>
    <line x1="400" y1="200" x2="690" y2="200"/>
    <line x1="400" y1="260" x2="690" y2="260"/>
  </g>
  <g fill="#c2410c">
    <circle cx="420" cy="128" r="5"/><circle cx="500" cy="128" r="5"/><circle cx="570" cy="128" r="5"/><circle cx="640" cy="128" r="5"/>
    <circle cx="420" cy="188" r="5"/><circle cx="500" cy="188" r="5"/><circle cx="570" cy="188" r="5"/><circle cx="640" cy="188" r="5"/>
    <circle cx="420" cy="248" r="5"/><circle cx="500" cy="248" r="5"/><circle cx="570" cy="248" r="5"/><circle cx="640" cy="248" r="5"/>
  </g>
  <g stroke="#c2410c" stroke-width="3">
    <line x1="690" y1="128" x2="690" y2="140"/><line x1="690" y1="188" x2="690" y2="200"/><line x1="690" y1="248" x2="690" y2="260"/>
  </g>
  <g fill="#5b6570" font-size="12">
    <text x="384" y="144">T1</text><text x="384" y="204">T2</text><text x="384" y="264">T3</text>
  </g>
  <text x="560" y="120" font-size="11" fill="#c2410c">max 落在最後一格</text>
  <rect x="24" y="292" width="672" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="316" font-size="12" fill="#0f1419">scale 算法：<tspan font-family="monospace">inv_scale = INT_MAX / max_abs</tspan>（US 2026/0299533 A1 [0076]–[0077]）</text>
  <text x="40" y="338" font-size="12" fill="#0f1419">只有矩陣乘法降到 INT8 跑（INT8 MAC）；正規化、softmax、殘差流留在 BF15 / BF16 / FP32</text>
  <text x="40" y="356" font-size="11" fill="#5b6570">盲點：同一 token 內的離群極端值會壓扁其他小值——專利未討論離群值處理。</text>
</svg>
